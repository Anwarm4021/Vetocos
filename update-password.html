<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Set new password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.25)}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    .wrap{max-width:600px;margin:0 auto;padding:24px 18px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .field{display:flex;flex-direction:column;gap:6px}
    .input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.03);color:var(--text)}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
      background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .note{color:var(--muted)} .err{color:#ff9090} .ok{color:#96f0b8}
    body.rtl{direction:rtl}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 data-i18n="reset.title">Set a new password</h1>
    <p class="note" data-i18n="reset.kicker">You arrived here from your password reset email.</p>

    <section class="card">
      <form id="resetForm">
        <div class="field">
          <label data-i18n="reset.new">New password</label>
          <input id="newPass" type="password" class="input" placeholder="New password" required data-i18n="reset.newPH" data-i18n-attr="placeholder">
        </div>
        <div class="field">
          <label data-i18n="reset.confirm">Confirm new password</label>
          <input id="newPass2" type="password" class="input" placeholder="Repeat new password" required data-i18n="reset.confirmPH" data-i18n-attr="placeholder">
        </div>
        <div style="margin-top:10px">
          <button id="setBtn" class="btn" type="submit" data-i18n="reset.submit">Update password</button>
        </div>
        <div id="msg" style="margin-top:10px"></div>
      </form>
    </section>

    <div style="margin-top:10px">
      <select id="lang-switch">
        <option value="en">English</option><option value="fr">Français</option>
        <option value="es">Español</option><option value="ar">العربية</option>
      </select>
    </div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const I18N = {
      en:{ "reset.title":"Set a new password","reset.kicker":"You arrived here from your password reset email.","reset.new":"New password","reset.newPH":"New password","reset.confirm":"Confirm new password","reset.confirmPH":"Repeat new password","reset.submit":"Update password","reset.badMatch":"Passwords do not match.","reset.invalid":"Your reset link is invalid or expired. Please request a new one.","reset.ok":"Password updated. Redirecting…" },
      fr:{ "reset.title":"Définir un nouveau mot de passe","reset.kicker":"Vous êtes arrivé depuis l’e-mail de réinitialisation.","reset.new":"Nouveau mot de passe","reset.newPH":"Nouveau mot de passe","reset.confirm":"Confirmez le mot de passe","reset.confirmPH":"Répétez le mot de passe","reset.submit":"Mettre à jour","reset.badMatch":"Les mots de passe ne correspondent pas.","reset.invalid":"Lien invalide ou expiré. Veuillez en demander un nouveau.","reset.ok":"Mot de passe mis à jour. Redirection…" },
      es:{ "reset.title":"Establecer nueva contraseña","reset.kicker":"Has llegado desde el correo de restablecimiento.","reset.new":"Nueva contraseña","reset.newPH":"Nueva contraseña","reset.confirm":"Confirmar contraseña","reset.confirmPH":"Repite la contraseña","reset.submit":"Actualizar contraseña","reset.badMatch":"Las contraseñas no coinciden.","reset.invalid":"Enlace no válido o caducado. Solicita uno nuevo.","reset.ok":"Contraseña actualizada. Redirigiendo…" },
      ar:{ "reset.title":"تعيين كلمة مرور جديدة","reset.kicker":"وصلت من رسالة إعادة التعيين.","reset.new":"كلمة المرور الجديدة","reset.newPH":"كلمة المرور الجديدة","reset.confirm":"تأكيد كلمة المرور","reset.confirmPH":"أعد إدخال كلمة المرور","reset.submit":"تحديث كلمة المرور","reset.badMatch":"كلمتا المرور غير متطابقتين.","reset.invalid":"الرابط غير صالح أو منتهي. اطلب رابطًا جديدًا.","reset.ok":"تم التحديث. سيتم التحويل…" }
    };
    function t(k){ const L=localStorage.getItem("lang")||"en"; return (I18N[L]&&I18N[L][k])||(I18N.en[k]||k); }
    function applyLang(lang){
      const dict=I18N[lang]||I18N.en;
      document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(dict[k]!=null) el.innerHTML=dict[k]; });
      document.querySelectorAll("[data-i18n-attr]").forEach(el=>{ const k=el.getAttribute("data-i18n"); const attrs=(el.getAttribute("data-i18n-attr")||"").split(",").map(s=>s.trim()).filter(Boolean); if(dict[k]==null) return; attrs.forEach(a=>el.setAttribute(a, dict[k])); });
      const html=document.documentElement; html.lang=lang; if(lang==="ar"){ html.dir="rtl"; document.body.classList.add("rtl"); } else { html.dir="ltr"; document.body.classList.remove("rtl"); }
      localStorage.setItem("lang",lang); const sel=document.getElementById("lang-switch"); if(sel) sel.value=lang;
    }
    document.addEventListener('DOMContentLoaded', ()=>{ const L=localStorage.getItem("lang")||"en"; applyLang(L); const sel=document.getElementById("lang-switch"); if(sel){ sel.value=L; sel.addEventListener("change",e=>applyLang(e.target.value)); } });

    const SUPABASE_URL = "https://qdepgviimbcdlozjpbhm.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });

    const qs = new URLSearchParams(location.search);
    const redirectTarget = qs.get('redirect') || 'Products.html';
    const $ = (id)=>document.getElementById(id);
    function setMsg(text, good=false){ const el=$('msg'); el.className = good?'ok':'err'; el.textContent = text; }
    function clearMsg(){ const el=$('msg'); el.className=''; el.textContent=''; }

    (async ()=>{
      // give time for recovery session to attach
      const { data:{ session } } = await supa.auth.getSession();
      if (!session?.user){
        setTimeout(async ()=>{
          const { data:{ session } } = await supa.auth.getSession();
          if (!session?.user) setMsg(t('reset.invalid'));
        }, 800);
      }
    })();

    $('resetForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      clearMsg();
      const p1 = $('newPass').value;
      const p2 = $('newPass2').value;
      if (p1 !== p2){ setMsg(t('reset.badMatch')); return; }
      try{
        const { error } = await supa.auth.updateUser({ password: p1 });
        if (error) throw error;
        setMsg(t('reset.ok'), true);
        setTimeout(()=> location.replace(redirectTarget), 600);
      }catch(err){
        setMsg(err?.message || 'Error');
      }
    });
  </script>
</body>
</html>
