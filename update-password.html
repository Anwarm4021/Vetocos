<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Set new password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.25)}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    .wrap{max-width:600px;margin:0 auto;padding:24px 18px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .field{display:flex;flex-direction:column;gap:6px}
    .input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.03);color:var(--text)}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
      background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .note{color:var(--muted)} .err{color:#ff9090} .ok{color:#96f0b8}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Set a new password</h1>
    <p class="note">You arrived here from your password reset email.</p>

    <section class="card">
      <form id="resetForm">
        <div class="field">
          <label>New password</label>
          <input id="newPass" type="password" class="input" placeholder="New password" required>
        </div>
        <div class="field">
          <label>Confirm new password</label>
          <input id="newPass2" type="password" class="input" placeholder="Repeat new password" required>
        </div>
        <div style="margin-top:10px">
          <button id="setBtn" class="btn" type="submit">Update password</button>
        </div>
        <div id="msg" style="margin-top:10px"></div>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qdepgviimbcdlozjpbhm.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    });

    const qs = new URLSearchParams(location.search);
    const redirectTarget = qs.get('redirect') || 'Products.html';

    const $ = (id)=>document.getElementById(id);
    function setMsg(text, good=false){ const el=$('msg'); el.className = good?'ok':'err'; el.textContent = text; }
    function clearMsg(){ const el=$('msg'); el.className=''; el.textContent=''; }

    // If a recovery session is created, Supabase stores it. If already signed in, we can proceed.
    (async ()=>{
      const { data:{ session } } = await supa.auth.getSession();
      if (!session?.user){
        // In some cases, the hash in the email link sets the session after a moment:
        setTimeout(async ()=>{
          const { data:{ session } } = await supa.auth.getSession();
          if (!session?.user){
            setMsg('Your reset link is invalid or expired. Please request a new one.'); 
          }
        }, 800);
      }
    })();

    $('resetForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      clearMsg();
      const p1 = $('newPass').value;
      const p2 = $('newPass2').value;
      if (p1 !== p2){ setMsg('Passwords do not match.'); return; }
      try{
        const { error } = await supa.auth.updateUser({ password: p1 });
        if (error) throw error;
        setMsg('Password updated. Redirecting…', true);
        setTimeout(()=> location.replace(redirectTarget), 600);
      }catch(err){
        setMsg(err?.message || 'Could not update password.');
      }
    });
  </script>
</body>
</html>
