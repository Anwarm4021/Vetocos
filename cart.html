<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,sans-serif;background:#0b1020;color:#f6f7fb}
    main{max-width:800px;margin:40px auto;padding:0 18px}
    h1{margin-bottom:20px}
    table{width:100%;border-collapse:collapse;background:#0f162f;border:1px solid rgba(141,158,199,.18);border-radius:10px;overflow:hidden}
    th,td{padding:12px;text-align:left}
    th{background:rgba(141,158,199,.15);color:#8ea0c8}
    tr:not(:last-child){border-bottom:1px solid rgba(141,158,199,.18)}
    .qty-btn{padding:4px 8px;border:none;border-radius:6px;background:rgba(255,255,255,.1);color:white;cursor:pointer}
    .remove{color:#ff8080;cursor:pointer}
    .summary{margin-top:20px;text-align:right;font-weight:600}
    .btn{margin-top:20px;display:inline-block;padding:12px 18px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:#f6f7fb;font-weight:600;cursor:pointer}
    .empty{text-align:center;padding:40px;background:#0f162f;border-radius:10px;color:#8ea0c8}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <h1>Your Cart</h1>
    <div id="cartBox"></div>
  </main>

  <script>
    /* ======================= Supabase client ======================= */
    const supa = supabase.createClient(
      "https://qdepgviimbcdlozjpbhm.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
      { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
    );

    /* ======================= Cart utils (idempotent) ======================= */
    const CART_KEY = 'cart';
    const CART_UPDATED_KEY = 'cart_updated_at';
    const CART_RESTORED_KEY = 'cart_restored_v2'; // per-tab session guard

    function getLocalBundle() {
      try {
        const items = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        const updated_at = localStorage.getItem(CART_UPDATED_KEY) || null;
        return { items: Array.isArray(items) ? items : [], updated_at };
      } catch {
        return { items: [], updated_at: null };
      }
    }
    function setLocalBundle(items, updatedAt = null) {
      const stamp = updatedAt || new Date().toISOString();
      const cleaned = (items || [])
        .filter(it => it && it.sku && Number(it.qty) > 0)
        .map(it => ({ ...it, qty: Number(it.qty) }));
      localStorage.setItem(CART_KEY, JSON.stringify(cleaned));
      localStorage.setItem(CART_UPDATED_KEY, stamp);
    }
    function readCart(){ return getLocalBundle().items; }

    // Overwrite quantities by SKU (no summing!)
    function overlayBySku(baseArr, incomingArr){
      const map = {};
      (baseArr || []).forEach(it => { if (it?.sku) map[it.sku] = { ...it, qty: Number(it.qty || 0) }; });
      (incomingArr || []).forEach(it => {
        if (!it?.sku) return;
        map[it.sku] = { ...map[it.sku], ...it, qty: Number(it.qty || 0) }; // overwrite qty
      });
      return Object.values(map).filter(x => x.qty > 0);
    }

    // Adopt ?cart= exactly once per tab session, then strip from URL
    function adoptQueryCartOnce(){
      if (sessionStorage.getItem(CART_RESTORED_KEY)) return;
      const qs = new URLSearchParams(location.search);
      const raw = qs.get('cart');
      if (!raw) return;
      try {
        const incoming = JSON.parse(decodeURIComponent(raw));
        const merged = overlayBySku(readCart(), Array.isArray(incoming) ? incoming : []);
        setLocalBundle(merged, new Date().toISOString());
      } catch(e){ console.warn('cart restore from URL failed', e); }
      finally {
        qs.delete('cart');
        const newUrl = location.pathname + (qs.toString() ? '?' + qs.toString() : '');
        history.replaceState({}, '', newUrl);
        sessionStorage.setItem(CART_RESTORED_KEY, '1');
      }
    }

    // Adopt cart_backup once (used after auth redirects), then clear it
    function adoptBackupCartOnce(){
      if (sessionStorage.getItem(CART_RESTORED_KEY)) return;
      const backup = localStorage.getItem('cart_backup');
      if (!backup) return;
      try {
        const incoming = JSON.parse(backup);
        const merged = overlayBySku(readCart(), Array.isArray(incoming) ? incoming : []);
        setLocalBundle(merged, new Date().toISOString());
      } catch(e){ console.warn('cart restore from backup failed', e); }
      finally {
        localStorage.removeItem('cart_backup');
        sessionStorage.setItem(CART_RESTORED_KEY, '1');
      }
    }

    // Write + upsert (last-writer-wins)
    async function writeCart(items){
      const updated_at = new Date().toISOString();
      setLocalBundle(items, updated_at);
      renderCart();
      const { data: { user } } = await supa.auth.getUser();
      if (user) {
        await supa.from('carts').upsert({ user_id: user.id, items, updated_at });
      }
    }

    /* ======================= Cross-device sync (last-writer-wins) ======================= */
    async function syncCartFromDB() {
      const { data: { user } } = await supa.auth.getUser();
      if (!user) return;

      const { data: row, error } = await supa
        .from('carts')
        .select('items, updated_at')
        .eq('user_id', user.id)
        .maybeSingle();
      if (error) { console.error('carts select error:', error); return; }

      const local = getLocalBundle();
      const serverItems = Array.isArray(row?.items) ? row.items : null;
      const serverUpdated = row?.updated_at || null;

      let chosenItems = [];
      let chosenUpdatedAt = new Date().toISOString();

      if (serverItems && (!local.items || local.items.length === 0)) {
        chosenItems = serverItems;
        chosenUpdatedAt = serverUpdated || chosenUpdatedAt;
        setLocalBundle(chosenItems, chosenUpdatedAt);
      } else if ((!serverItems || serverItems.length === 0) && local.items.length > 0) {
        chosenItems = local.items;
        chosenUpdatedAt = local.updated_at || chosenUpdatedAt;
        await supa.from('carts').upsert({ user_id: user.id, items: chosenItems, updated_at: chosenUpdatedAt });
      } else if (serverItems && local.items.length > 0) {
        const localTime = local.updated_at ? Date.parse(local.updated_at) : 0;
        const serverTime = serverUpdated ? Date.parse(serverUpdated) : 0;
        if (serverTime >= localTime) {
          chosenItems = serverItems;
          chosenUpdatedAt = serverUpdated || chosenUpdatedAt;
          setLocalBundle(chosenItems, chosenUpdatedAt);
        } else {
          chosenItems = local.items;
          chosenUpdatedAt = local.updated_at || chosenUpdatedAt;
          await supa.from('carts').upsert({ user_id: user.id, items: chosenItems, updated_at: chosenUpdatedAt });
        }
      } else {
        chosenItems = [];
        setLocalBundle([], chosenUpdatedAt);
      }

      renderCart();
    }

    /* ======================= Boot: adopt once, then sync ======================= */
    adoptQueryCartOnce();
    adoptBackupCartOnce();

    /* ======================= Rendering ======================= */
    async function renderCart() {
      const cart = readCart();
      const box = document.getElementById("cartBox");

      if (cart.length === 0) {
        box.innerHTML = `<div class="empty">Your cart is empty</div>`;
        return;
      }

      // Fill missing product names
      const missing = cart.filter(i => !i.name).map(i => i.sku);
      if (missing.length > 0) {
        const { data: products } = await supa.from("products").select("sku,name").in("sku", missing);
        if (Array.isArray(products)) {
          const nameMap = Object.fromEntries(products.map(p => [p.sku, p.name]));
          const updated = cart.map(i => ({ ...i, name: i.name || nameMap[i.sku] || i.sku }));
          setLocalBundle(updated, new Date().toISOString());
        }
      }

      const current = readCart(); // re-read in case names were set
      const rows = current.map(item => `
        <tr>
          <td>${item.name || item.sku}</td>
          <td>
            <button class="qty-btn" onclick="changeQty('${item.sku}', -1)">-</button>
            ${Number(item.qty || 0)}
            <button class="qty-btn" onclick="changeQty('${item.sku}', 1)">+</button>
          </td>
          <td><span class="remove" onclick="removeItem('${item.sku}')">Remove</span></td>
        </tr>
      `).join("");

      box.innerHTML = `
        <table>
          <tr><th>Product</th><th>Quantity</th><th>Action</th></tr>
          ${rows}
        </table>
        <div class="summary">Total items: ${current.reduce((n, x) => n + Number(x.qty || 0), 0)}</div>
        <button class="btn" onclick="proceedCheckout()">Proceed to Checkout</button>
      `;
    }

    /* ======================= Cart operations ======================= */
    function changeQty(sku, delta) {
      const cart = readCart();
      const i = cart.findIndex(x => x.sku === sku);
      if (i > -1) {
        cart[i].qty = Number(cart[i].qty || 0) + Number(delta || 0);
        if (cart[i].qty <= 0) cart.splice(i, 1);
        writeCart(cart);
      }
    }
    function removeItem(sku) {
      writeCart(readCart().filter(x => x.sku !== sku));
    }

    /* ======================= Checkout flow ======================= */
    async function proceedCheckout(){
      const cart = readCart();
      // Save a one-time backup for auth redirects
      localStorage.setItem('cart_backup', JSON.stringify(cart));
      // Pass cart via URL once; receiving page will adopt-once and strip it
      const cartParam = encodeURIComponent(JSON.stringify(cart));
      const loginUrl  = `login.html?redirect=${encodeURIComponent('checkout.html')}&cart=${cartParam}&force=1`;
      location.href = loginUrl;
    }

    /* ======================= Boot sequence ======================= */
    document.addEventListener('DOMContentLoaded', async () => {
      renderCart();
      await syncCartFromDB();
    });
    supa.auth.onAuthStateChange((_event, session) => {
      if (session?.user) syncCartFromDB();
    });
  </script>
</body>
</html>
