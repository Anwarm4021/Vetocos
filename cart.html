<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VetoCos | Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,sans-serif;background:#0b1020;color:#f6f7fb;padding:20px}
  .btn{padding:10px 14px;margin:5px;border-radius:8px;border:1px solid #6dd5ff;background:#0f162f;color:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>Your Cart</h1>
<div id="cartItems"></div>
<button class="btn" onclick="proceedCheckout()">Proceed to Checkout</button>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0"
);

function loadCart(){
  const cart=JSON.parse(localStorage.getItem("cart")||"[]");
  const div=document.getElementById("cartItems");
  if(cart.length===0){div.innerHTML="<p>Cart is empty</p>";return;}
  div.innerHTML=cart.map(sku=>`<p>${sku}</p>`).join("");
}
loadCart();

async function proceedCheckout(){
  const { data:{user} }=await supa.auth.getUser();
  if(!user){
    location.href=`login.html?redirect=cart.html`;
    return;
  }
  const { data } = await supa.from("vet_applications").select("status").eq("user_id",user.id).maybeSingle();
  if(!data || data.status!=="approved"){
    alert("You must be an approved veterinarian to checkout.");
    location.href="vet-verify.html";
    return;
  }
  location.href="checkout.html";
}
</script>
</body>
</html>
