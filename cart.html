<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,sans-serif;background:#0b1020;color:#f6f7fb}
    main{max-width:800px;margin:40px auto;padding:0 18px}
    h1{margin-bottom:20px}
    table{width:100%;border-collapse:collapse;background:#0f162f;border:1px solid rgba(141,158,199,.18);border-radius:10px;overflow:hidden}
    th,td{padding:12px;text-align:left}
    th{background:rgba(141,158,199,.15);color:#8ea0c8}
    tr:not(:last-child){border-bottom:1px solid rgba(141,158,199,.18)}
    .qty-btn{padding:4px 8px;border:none;border-radius:6px;background:rgba(255,255,255,.1);color:white;cursor:pointer}
    .remove{color:#ff8080;cursor:pointer}
    .summary{margin-top:20px;text-align:right;font-weight:600}
    .btn{margin-top:20px;display:inline-block;padding:12px 18px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:#f6f7fb;font-weight:600;cursor:pointer}
    .empty{text-align:center;padding:40px;background:#0f162f;border-radius:10px;color:#8ea0c8}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Your Cart</h1>
  <div id="cartBox"></div>
</main>

<script>
/* =======================
   Supabase client
   ======================= */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0"
);

/* =======================
   Local cart helpers
   ======================= */
function readCart(){
  try { return JSON.parse(localStorage.getItem("cart")||"[]"); }
  catch { return []; }
}

async function writeCart(items){
  localStorage.setItem("cart", JSON.stringify(items));
  renderCart(); // update UI immediately

  // If logged in, persist to DB so other devices see it
  const { data: { user } } = await supa.auth.getUser();
  if (user) {
    await supa.from('carts').upsert({
      user_id: user.id,
      items,
      updated_at: new Date().toISOString()
    });
  }
}

/* Utility: shallow equal carts (order-insensitive) */
function sameCart(a = [], b = []) {
  const m = x => Object.fromEntries(x.map(i => [i.sku, Number(i.qty||0)]));
  const A = m(a), B = m(b);
  const keys = new Set([...Object.keys(A), ...Object.keys(B)]);
  for (const k of keys) if ((A[k]||0) !== (B[k]||0)) return false;
  return true;
}

/* =======================
   Cross-device sync (NO auto-summing)
   Strategy:
   - If a DB cart exists → take DB as source of truth (avoid doubles).
   - If no DB cart → push local to DB (first-time user on server).
   ======================= */
async function syncCartFromDB(){
  const { data: { user } } = await supa.auth.getUser();
  if (!user) return; // nothing to sync if not logged in

  const { data: row, error } = await supa
    .from('carts')
    .select('items')
    .eq('user_id', user.id)
    .maybeSingle();

  if (error) { console.error('carts select error:', error); return; }

  const local = readCart();

  if (row && Array.isArray(row.items)) {
    // If DB already has a cart, prefer DB (unless identical)
    if (!sameCart(local, row.items)) {
      localStorage.setItem("cart", JSON.stringify(row.items));
      renderCart();
    }
  } else {
    // No row yet → push local (if any) to DB
    if (local.length > 0) {
      await supa.from('carts').upsert({
        user_id: user.id,
        items: local,
        updated_at: new Date().toISOString()
      });
    }
  }
}

/* If login.html redirected with ?cart=..., merge it in ONCE (without duplicating) */
(function mergeCartFromURLOnce(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('cart');
  if (!raw) return;
  try {
    const fromURL = JSON.parse(decodeURIComponent(raw));
    if (Array.isArray(fromURL) && fromURL.length) {
      // Merge without summing duplicates blindly: take max qty per sku
      const local = readCart();
      const map = {};
      [...local, ...fromURL].forEach(it=>{
        if (!it || !it.sku) return;
        const q = Number(it.qty||0);
        if (!map[it.sku]) map[it.sku] = { sku: it.sku, qty: q, name: it.name };
        else map[it.sku].qty = Math.max(map[it.sku].qty, q);
        if (it.name && !map[it.sku].name) map[it.sku].name = it.name;
      });
      const merged = Object.values(map).filter(x=>x.qty>0);
      localStorage.setItem("cart", JSON.stringify(merged));
      // Clean the URL (no reload)
      history.replaceState({}, "", location.pathname);
    }
  } catch(e){ console.warn('Invalid cart param'); }
})();

/* =======================
   Rendering
   ======================= */
async function renderCart(){
  const cart = readCart();
  const box = document.getElementById("cartBox");

  if(cart.length===0){
    box.innerHTML = `<div class="empty">Your cart is empty</div>`;
    return;
  }

  // Ensure product names exist (fetch by SKU if missing)
  const missingNames = cart.filter(i => !i.name).map(i => i.sku);
  if (missingNames.length > 0) {
    const { data: products, error } = await supa
      .from("products")
      .select("sku,name")
      .in("sku", missingNames);

    if (!error && Array.isArray(products)) {
      const nameMap = Object.fromEntries(products.map(p => [p.sku, p.name]));
      cart.forEach(i => { if (!i.name && nameMap[i.sku]) i.name = nameMap[i.sku]; });
      // save enriched cart (so future renders are instant)
      localStorage.setItem("cart", JSON.stringify(cart));
    }
  }

  const rows = cart.map(item => `
    <tr>
      <td>${item.name || item.sku}</td>
      <td>
        <button class="qty-btn" onclick="changeQty('${item.sku}',-1)">-</button>
        ${item.qty}
        <button class="qty-btn" onclick="changeQty('${item.sku}',1)">+</button>
      </td>
      <td><span class="remove" onclick="removeItem('${item.sku}')">Remove</span></td>
    </tr>
  `).join("");

  box.innerHTML = `
    <table>
      <tr><th>Product</th><th>Quantity</th><th>Action</th></tr>
      ${rows}
    </table>
    <div class="summary">Total items: ${cart.reduce((n,x)=>n+Number(x.qty||0),0)}</div>
    <button class="btn" onclick="proceedCheckout()">Proceed to Checkout</button>
  `;
}

/* =======================
   Cart operations
   ======================= */
function changeQty(sku, delta){
  const cart = readCart();
  const i = cart.findIndex(x => x.sku === sku);
  if (i > -1) {
    cart[i].qty += delta;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    writeCart(cart);
  }
}

function removeItem(sku){
  const cart = readCart().filter(x => x.sku !== sku);
  writeCart(cart);
}

/* =======================
   Checkout flow
   ======================= */
async function proceedCheckout(){
  const { data:{user} } = await supa.auth.getUser();
  const cart = readCart();
  const cartParam = encodeURIComponent(JSON.stringify(cart));
  if (!user) {
    // Send user to login, then directly to verification/checkout page
    location.href = `login.html?redirect=${encodeURIComponent('checkout.html')}&cart=${cartParam}`;
    return;
  }
  // Go straight to verification page (checkout.html you added earlier)
  location.href = `checkout.html?cart=${cartParam}`;
}

/* =======================
   Boot
   ======================= */
document.addEventListener('DOMContentLoaded', async () => {
  renderCart();          // 1) fast UI from local
  await syncCartFromDB(); // 2) then align with server (no doubling)
});

// If auth state changes, refresh from DB once
supa.auth.onAuthStateChange((_event, session) => {
  if (session?.user) syncCartFromDB();
});
</script>
</body>
</html>
