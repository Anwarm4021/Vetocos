<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Your cart and purchases on VetoCos." />
  <meta name="theme-color" content="#0b1020" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0b1020; --card:#0f162f; --muted:#8ea0c8; --text:#f6f7fb; --radius:12px; --shadow:0 10px 30px rgba(0,0,0,.25) }
    *{ box-sizing:border-box }
    body{ margin:0; font-family:Inter,sans-serif; background:linear-gradient(135deg,var(--bg),#101835); color:var(--text) }

    /* Header */
    header.site{position:sticky;top:0;z-index:60;background:rgba(11,16,32,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(141,158,199,.15)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .wrap{ max-width:1100px; margin:0 auto; padding:0 18px }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700}
    .brand-logo{width:60px;height:auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
    .links{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn, .contact-btn, #lang-switch{
      padding:10px 12px;border-radius:12px;border:1px solid rgba(141,158,199,.25);
      background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer
    }
    #lang-switch{background:rgba(255,255,255,.04);min-width:120px}

    /* Main */
    main{ max-width:1100px; margin:40px auto; padding:0 18px }
    h1{ margin:0 0 16px }
    h2{ margin:26px 0 10px; font-size:1.15rem }
    .card{ background:var(--card); border:1px solid rgba(141,158,199,.18); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow) }
    table{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid rgba(141,158,199,.18); border-radius:10px; overflow:hidden }
    th,td{ padding:12px; text-align:left; vertical-align:middle }
    th{ background:rgba(141,158,199,.15); color:var(--muted) }
    tr:not(:last-child){ border-bottom:1px solid rgba(141,158,199,.18) }
    .qty-btn{ padding:4px 8px; border:none; border-radius:6px; background:rgba(255,255,255,.1); color:white; cursor:pointer }
    .qty-btn:disabled{ opacity:.6; cursor:not-allowed }
    .summary{ margin-top:14px; text-align:right; font-weight:600 }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between }
    .btn.primary{ margin-top:14px; display:inline-block; padding:12px 18px; border-radius:10px; border:1px solid rgba(141,158,199,.25); background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12)); color:#f6f7fb; font-weight:600; cursor:pointer }
    .btn.secondary{ background:rgba(255,255,255,.04) }
    .btn[disabled]{ opacity:.6; cursor:not-allowed }
    .empty{ text-align:center; padding:36px; background:var(--card); border:1px solid rgba(141,158,199,.18); border-radius:10px; color:var(--muted) }
    .muted{ color:var(--muted) }
    .orders{ margin-top:28px }
    .order{ padding:12px 0; border-top:1px solid rgba(141,158,199,.18) }
    .order:first-child{ border-top:none }
    .badge{ display:inline-block; padding:4px 8px; border-radius:999px; border:1px solid rgba(141,158,199,.25); font-size:12px }
    .badge.ok{ background:rgba(131,240,165,.12) }
    .badge.warn{ background:rgba(255,200,120,.12) }
    .badge.bad{ background:rgba(255,120,120,.12) }
    .price{white-space:nowrap}
    .note{ font-size:.88rem; color:var(--muted) }

    /* Footer */
    footer{margin:40px 0 0;padding:28px 0;border-top:1px solid rgba(141,158,199,.18);color:var(--muted);font-size:14px}
    .footer-links{display:flex;gap:14px;flex-wrap:wrap}

    /* Modals */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,18,.6);backdrop-filter:blur(6px);z-index:90}
    .modal.open{display:flex}
    .sheet{width:min(780px,100%);background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(141,158,199,.12)}
    .sheet-title{margin:0;font-size:1.1rem}
    .close{background:transparent;border:1px solid rgba(141,158,199,.25);border-radius:10px;color:var(--text);padding:6px 10px;cursor:pointer}
    .sheet-body{padding:16px}
    .pro-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
    @media(max-width:860px){.pro-grid{grid-template-columns:1fr}}
    .field{display:flex;flex-direction:column;gap:6px}
    .input,.select,.textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.03);color:var(--text);outline:none}
    .textarea{min-height:140px;resize:vertical}
    .hint12{font-size:12px;color:var(--muted)}
    .actions-fw{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
    .divider{height:1px;background:rgba(141,158,199,.12);margin:8px 0}

    /* RTL */
    body.rtl .wrap, body.rtl main, body.rtl table, body.rtl .pro-grid{direction:rtl}
    body.rtl th, body.rtl td{text-align:inherit}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header -->
  <header class="site">
    <div class="wrap nav">
      <div class="brand">
        <a href="index.html" aria-label="VetoCos home">
          <img class="brand-logo" src="images/logo.png" alt="VetoCos logo">
        </a>
        <span>VetoCos</span>
      </div>
      <nav class="links">
        <a class="btn" href="Products.html" data-i18n="nav.products">Products</a>
        <a class="btn" href="vet-verify.html" data-i18n="nav.verify">Verification</a>
        <a class="btn" href="account.html" data-i18n="nav.account">My Account</a>
        <button class="contact-btn" type="button" onclick="openContact()" data-i18n="nav.contact">Contact</button>
        <select id="lang-switch" aria-label="Language">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
      </nav>
    </div>
  </header>

  <main>
    <h1 data-i18n="page.title">Your Cart</h1>
    <div id="cartBox" aria-live="polite"></div>

    <!-- Orders -->
    <section class="orders">
      <div class="row">
        <h2 style="margin:0" data-i18n="orders.title">Your Purchases</h2>
        <div id="ordersHint" class="muted hint" data-i18n="orders.hint">Sign in to see your purchase history.</div>
      </div>
      <div id="ordersBox" class="card" style="margin-top:10px;display:none"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="wrap">
      © <span id="y"></span> VetoCos · <span data-i18n="footer.tag">Complementary feed for companion animals.</span>
      <div class="footer-links">
        <a href="#" onclick="openPolicy();return false;" data-i18n="footer.policy">Privacy & Policy</a>
        <a href="#" onclick="openContact();return false;" data-i18n="footer.contact">Contact</a>
      </div>
    </div>
  </footer>

  <!-- CONTACT MODAL (unchanged content) -->
  <!-- ... (keep your exact Contact / Policy modals as in your original) ... -->

  <script>
    /* ======================= i18n (keep your original dictionaries) ======================= */
    const I18N = /* your exact dictionaries from the original cart.html */;
    function applyLang(lang){
      const dict=I18N[lang]||I18N.en;
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const k=el.getAttribute("data-i18n"); if(dict[k]!=null) el.innerHTML=dict[k];
      });
      document.querySelectorAll("[data-i18n-attr]").forEach(el=>{
        const k=el.getAttribute("data-i18n"); const attrs=(el.getAttribute("data-i18n-attr")||"").split(",").map(s=>s.trim()).filter(Boolean);
        if(dict[k]==null) return; attrs.forEach(a=>el.setAttribute(a, dict[k]));
      });
      const html=document.documentElement; html.lang=lang; if(lang==="ar"){ html.dir="rtl"; document.body.classList.add("rtl"); } else { html.dir="ltr"; document.body.classList.remove("rtl"); }
      localStorage.setItem("lang",lang); const sel=document.getElementById('lang-switch'); if(sel) sel.value=lang;
    }
    function t(k){ const L=localStorage.getItem("lang")||"en"; return (I18N[L]&&I18N[L][k])||(I18N.en[k]||k); }

    /* Contact / Policy modal helpers – keep your originals */
    // openContact / closeContact / openPolicy / closePolicy / sendMailto ...
  </script>

  <script>
    /* ======================= Supabase client ======================= */
    const supa = supabase.createClient(
      "https://qdepgviimbcdlozjpbhm.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
      { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
    );

    /* ======================= Cart + stock + prices ======================= */
    const CART_KEY = 'cart';
    const CART_UPDATED_KEY = 'cart_updated_at';
    const CART_RESTORED_KEY = 'cart_restored_v2';

    // sku -> { sku, name, stock_qty:number|null, available:boolean|null, price_mad:number|null, bulk_10_price_mad:number|null }
    let PRODUCTS = Object.create(null);

    function getLocalBundle() {
      try {
        const items = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        const updated_at = localStorage.getItem(CART_UPDATED_KEY) || null;
        return { items: Array.isArray(items) ? items : [], updated_at };
      } catch {
        return { items: [], updated_at: null };
      }
    }
    function setLocalBundle(items, updatedAt = null) {
      const stamp = updatedAt || new Date().toISOString();
      const cleaned = (items || [])
        .filter(it => it && it.sku && Number(it.qty) > 0)
        .map(it => ({ sku:String(it.sku), name:String(it.name || it.sku), qty:Number(it.qty) }));
      localStorage.setItem(CART_KEY, JSON.stringify(cleaned));
      localStorage.setItem(CART_UPDATED_KEY, stamp);
    }
    function readCart(){ return getLocalBundle().items; }
    async function writeCart(items){
      const updated_at = new Date().toISOString();
      const clamped = clampCartToStock(items);
      setLocalBundle(clamped, updated_at);
      await renderCart();
      const { data:{ user } } = await supa.auth.getUser();
      if (user) { await supa.from('carts').upsert({ user_id:user.id, items:clamped, updated_at }); }
    }

    function overlayBySku(baseArr, incomingArr){
      const map = {};
      (baseArr || []).forEach(it => { if (it?.sku) map[it.sku] = { ...it, qty:Number(it.qty||0) }; });
      (incomingArr || []).forEach(it => { if (it?.sku) map[it.sku] = { ...map[it.sku], ...it, qty:Number(it.qty||0) }; });
      return Object.values(map).filter(x => x.qty > 0);
    }

    function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]) ); }
    function escapeAttr(s=''){ return String(s).replace(/['"\\]/g, m=>({"'":"&#39;",'"':"&quot;","\\":"\\\\"}[m])); }

    /* ======================= Stock helpers ======================= */
    function getMaxForSKU(sku){
      const p = PRODUCTS[sku] || {};
      if (p.available === false) return 0;
      if (typeof p.stock_qty === 'number' && p.stock_qty >= 0) return p.stock_qty;
      return Infinity; // unknown stock -> no limit
    }
    function clampCartToStock(items){
      return (items||[]).map(it=>{
        const max = getMaxForSKU(it.sku);
        const newQty = Math.max(0, Math.min(Number(it.qty||0), Number.isFinite(max)?max:it.qty));
        return { ...it, qty:newQty };
      }).filter(x=>x.qty>0);
    }

    /* ======================= Price helpers ======================= */
    function totalCartQty(){
      return readCart().reduce((n,x)=> n + Number(x.qty||0), 0);
    }
    function unitPriceFor(sku){
      const p = PRODUCTS[sku] || {};
      const base = Number(p.price_mad || 0);
      const bulk = Number(p.bulk_10_price_mad || base);
      return totalCartQty() > 10 ? bulk : base;
    }
    function lineTotal(item){
      return unitPriceFor(item.sku) * Number(item.qty||0);
    }
    function fmtMAD(n){
      const v = Number(n||0);
      return isNaN(v) ? '—' : (v.toFixed(2) + ' MAD');
    }

    async function loadProductsForCart(){
      const skus = [...new Set(readCart().map(x=>x.sku))];
      PRODUCTS = {};
      if (!skus.length) return;

      const { data, error } = await supa
        .from('products')
        .select('sku,name,stock_qty,available,price_mad,bulk_10_price_mad')
        .in('sku', skus);

      if (!error && Array.isArray(data)){
        data.forEach(p => PRODUCTS[p.sku] = p);
      }

      // Fill missing names into cart for display + clamp to stock
      const nameMap = Object.fromEntries((data||[]).map(p => [p.sku, p.name]));
      const withNames = readCart().map(i => ({ ...i, name: i.name || nameMap[i.sku] || i.sku }));
      await writeCart(withNames);
    }

    /* ======================= Adopt cart once ======================= */
    function adoptQueryCartOnce(){
      if (sessionStorage.getItem(CART_RESTORED_KEY)) return;
      const qs = new URLSearchParams(location.search);
      const raw = qs.get('cart');
      if (!raw) return;
      try {
        const incoming = JSON.parse(decodeURIComponent(raw));
        const merged = overlayBySku(readCart(), Array.isArray(incoming) ? incoming : []);
        setLocalBundle(merged, new Date().toISOString());
      } catch(e){ console.warn('cart restore from URL failed', e); }
      finally {
        qs.delete('cart');
        const newUrl = location.pathname + (qs.toString() ? '?' + qs.toString() : '');
        history.replaceState({}, '', newUrl);
        sessionStorage.setItem(CART_RESTORED_KEY, '1');
      }
    }
    function adoptBackupCartOnce(){
      if (sessionStorage.getItem(CART_RESTORED_KEY)) return;
      const backup = localStorage.getItem('cart_backup');
      if (!backup) return;
      try {
        const incoming = JSON.parse(backup);
        const merged = overlayBySku(readCart(), Array.isArray(incoming) ? incoming : []);
        setLocalBundle(merged, new Date().toISOString());
      } catch(e){ console.warn('backup restore failed', e); }
      finally {
        localStorage.removeItem('cart_backup');
        sessionStorage.setItem(CART_RESTORED_KEY, '1');
      }
    }

    /* ======================= Cross-device sync ======================= */
    async function syncCartFromDB() {
      const { data:{ user } } = await supa.auth.getUser();
      if (!user) return;

      const { data: row, error } = await supa
        .from('carts')
        .select('items, updated_at')
        .eq('user_id', user.id)
        .maybeSingle();
      if (error) { console.error('carts select error:', error); return; }

      const local = getLocalBundle();
      const serverItems = Array.isArray(row?.items) ? row.items : null;
      const serverUpdated = row?.updated_at || null;

      let chosenItems = [];
      let chosenUpdatedAt = new Date().toISOString();

      if (serverItems && (!local.items || local.items.length === 0)) {
        chosenItems = serverItems; chosenUpdatedAt = serverUpdated || chosenUpdatedAt;
        setLocalBundle(chosenItems, chosenUpdatedAt);
      } else if ((!serverItems || serverItems.length === 0) && local.items.length > 0) {
        chosenItems = local.items; chosenUpdatedAt = local.updated_at || chosenUpdatedAt;
        await supa.from('carts').upsert({ user_id:user.id, items:chosenItems, updated_at:chosenUpdatedAt });
      } else if (serverItems && local.items.length > 0) {
        const localTime = local.updated_at ? Date.parse(local.updated_at) : 0;
        const serverTime = serverUpdated ? Date.parse(serverUpdated) : 0;
        if (serverTime >= localTime) {
          chosenItems = serverItems; chosenUpdatedAt = serverUpdated || chosenUpdatedAt;
          setLocalBundle(chosenItems, chosenUpdatedAt);
        } else {
          chosenItems = local.items; chosenUpdatedAt = local.updated_at || chosenUpdatedAt;
          await supa.from('carts').upsert({ user_id:user.id, items:chosenItems, updated_at:chosenUpdatedAt });
        }
      } else {
        chosenItems = []; setLocalBundle([], chosenUpdatedAt);
      }

      await loadProductsForCart();
      await renderCart();
    }

    /* ======================= UI render ======================= */
    function badgeHTML(max, qty){
      if (max === 0) return `<span class="badge bad">${t('cart.unavailable')}</span>`;
      if (Number.isFinite(max) && max >= 0){
        if (qty >= max || max <= 5){
          return `<span class="badge warn">${t('cart.onlyLeft').replace('{n}', max)}</span>`;
        }
      }
      return `<span class="badge ok">${t('cart.ok')}</span>`;
    }

    async function renderCart() {
      const cart = readCart();
      const box = document.getElementById("cartBox");

      if (cart.length === 0) {
        box.innerHTML = `<div class="empty">${t('cart.empty')}</div>`;
        return;
      }

      // Ensure prices/stock present
      const need = cart.some(it => !(it.sku in PRODUCTS));
      if (need) await loadProductsForCart();

      const current = readCart(); // may be clamped by loadProductsForCart()
      const grandQty = totalCartQty();
      const bulkActive = grandQty > 10;

      const rows = current.map(item => {
        const max = getMaxForSKU(item.sku);
        const qty = Number(item.qty || 0);
        const plusDisabled = !(max === Infinity || qty < max);
        const minusDisabled = qty <= 1;
        const badge = badgeHTML(max, qty);

        const unit = unitPriceFor(item.sku);
        const subtotal = lineTotal(item);

        return `
          <tr>
            <td>
              <div><strong>${escapeHtml(item.name || item.sku)}</strong></div>
              <div class="note">${escapeHtml(item.sku)}</div>
              <div style="margin-top:6px">${badge}</div>
            </td>
            <td class="price">${fmtMAD(unit)}</td>
            <td>
              <button class="qty-btn" aria-label="Decrease ${escapeAttr(item.name||item.sku)} quantity" onclick="changeQty('${escapeAttr(item.sku)}', -1)" ${minusDisabled?'disabled':''}>-</button>
              ${qty}
              <button class="qty-btn" aria-label="Increase ${escapeAttr(item.name||item.sku)} quantity" onclick="changeQty('${escapeAttr(item.sku)}', 1)" ${plusDisabled?'disabled':''}>+</button>
            </td>
            <td class="price"><strong>${fmtMAD(subtotal)}</strong></td>
            <td><button class="qty-btn" style="background:transparent;border:1px solid rgba(255,128,128,.4)" onclick="removeItem('${escapeAttr(item.sku)}')">${t('cart.remove')}</button></td>
          </tr>
        `;
      }).join("");

      const totalAmount = current.reduce((s,it)=> s + lineTotal(it), 0);

      box.innerHTML = `
        <div class="card">
          <table aria-label="Cart items">
            <tr>
              <th>${t('cart.product')}</th>
              <th>Unit</th>
              <th>${t('cart.qty')}</th>
              <th>Subtotal</th>
              <th>${t('cart.action')}</th>
            </tr>
            ${rows}
          </table>
          <div class="row" style="margin-top:10px">
            <div class="muted">
              ${t('cart.stockNote')}
              ${bulkActive ? `<span class="badge ok" style="margin-left:8px">Bulk pricing applied (&gt; 10 items)</span>` : ''}
            </div>
            <div class="summary">
              ${t('cart.total')} ${grandQty} · <span>Amount: <strong>${fmtMAD(totalAmount)}</strong></span>
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn secondary" onclick="clearCart()">${t('cart.clear')}</button>
            <button class="btn primary" onclick="proceedCheckout()">${t('cart.proceed')}</button>
          </div>
        </div>
      `;
    }

    /* ======================= Cart ops (stock-aware) ======================= */
    async function changeQty(sku, delta) {
      const cart = readCart();
      const i = cart.findIndex(x => x.sku === sku);
      if (i === -1) return;

      const max = getMaxForSKU(sku);

      if (delta > 0) {
        if (!Number.isFinite(max) ? false : (max <= 0)) return;
        const next = Number(cart[i].qty || 0) + 1;
        if (Number.isFinite(max) && next > max) return;
        cart[i].qty = next;
      } else if (delta < 0) {
        const next = Number(cart[i].qty || 0) - 1;
        if (next <= 0) {
          cart.splice(i, 1);
        } else {
          cart[i].qty = next;
        }
      }
      await writeCart(cart);
    }

    async function removeItem(sku) { await writeCart(readCart().filter(x => x.sku !== sku)); }
    async function clearCart() { await writeCart([]); }

    /* ======================= Proceed flow ======================= */
    async function proceedCheckout(){
      const cart = readCart();
      if (!cart.length) return;
      localStorage.setItem('cart_backup', JSON.stringify(cart));
      const { data:{ session } } = await supa.auth.getSession();
      const cartParam = encodeURIComponent(JSON.stringify(cart));
      if (session?.user) {
        location.href = `checkout.html?cart=${cartParam}`;
      } else {
        location.href = `login.html?redirect=${encodeURIComponent('checkout.html')}&cart=${cartParam}&force=1`;
      }
    }

    /* ======================= Orders ======================= */
    async function renderOrders(){
      const ordersBox = document.getElementById('ordersBox');
      const hint = document.getElementById('ordersHint');
      const { data:{ user } } = await supa.auth.getUser();

      if (!user) {
        ordersBox.style.display = 'none';
        hint.textContent = t('orders.hint');
        return;
      }
      hint.textContent = t('orders.signed');
      ordersBox.style.display = 'block';
      ordersBox.innerHTML = `<div class="muted">${t('orders.loading')}</div>`;

      const { data: orders, error } = await supa
        .from('orders')
        .select('id, created_at, status, total_qty, total_amount, receipt_url')
        .eq('user_id', user.id)
        .order('created_at', { ascending:false })
        .limit(20);

      if (error) {
        ordersBox.innerHTML = `<div class="muted">Could not load orders: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!orders || !orders.length){
        ordersBox.innerHTML = `<div class="muted">${t('orders.none')}</div>`;
        return;
      }

      ordersBox.innerHTML = orders.map(o=>{
        const d = new Date(o.created_at);
        const badgeCls = (o.status||'').toLowerCase()==='paid' ? 'ok' : 'warn';
        const amountTxt = (o.total_amount!=null) ? ` · Amount: ${Number(o.total_amount).toFixed(2)} MAD` : '';
        const qtyTxt = (o.total_qty!=null) ? ` · Items: ${o.total_qty}` : '';
        const rec = o.receipt_url ? `<a href="${escapeAttr(o.receipt_url)}" target="_blank" rel="noopener">${t('orders.receipt')}</a>` : '';
        return `
          <div class="order">
            <div class="row">
              <div><strong>Order #${escapeHtml(o.id)}</strong> · <span class="muted">${d.toLocaleString()}</span></div>
              <span class="badge ${badgeCls}">${escapeHtml(o.status || 'pending')}</span>
            </div>
            <div class="muted">${qtyTxt}${amountTxt}</div>
            <div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">
              ${rec}
            </div>
          </div>
        `;
      }).join('');
    }

    /* ======================= Boot ======================= */
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('y').textContent=new Date().getFullYear();
      const d=new Date(); const month=d.toLocaleString('default',{month:'long'}); const pd=document.getElementById('policyDate'); if(pd) pd.textContent=month+' '+d.getFullYear();
      const initial=localStorage.getItem("lang")||"en"; applyLang(initial);
      const sel=document.getElementById('lang-switch'); if(sel){ sel.value=initial; sel.addEventListener('change',e=>applyLang(e.target.value)); }

      adoptQueryCartOnce();
      adoptBackupCartOnce();
      await loadProductsForCart();
      await renderCart();
      await syncCartFromDB();
      await renderOrders();
    });

    supa.auth.onAuthStateChange((_event, session) => {
      if (session?.user) { syncCartFromDB(); renderOrders(); }
      else { renderOrders(); }
    });
  </script>
</body>
</html>
