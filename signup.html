<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Sign up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Create your VetoCos account." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--brand:#6dd5ff;--brand2:#83f0a5;--radius:16px;--max:980px;--shadow:0 10px 30px rgba(0,0,0,.25)}
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
    a{color:var(--brand);text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 18px}

    header.site{position:sticky;top:0;z-index:60;background:rgba(11,16,32,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(141,158,199,.15)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700}
    .brand-logo{width:60px;height:auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
    .links{display:flex;gap:10px;align-items:center}
    .contact-btn{
      padding:8px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
      background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);cursor:pointer
    }

    main{max-width:780px;margin:7vh auto;padding:0 18px}
    .box{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    h1{margin:.3rem 0 1rem}
    label{display:block;font-size:.95rem;color:var(--muted);margin-top:10px}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text);margin-top:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}
    .btn{margin-top:14px;display:inline-block;padding:12px 18px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:#f6f7fb;font-weight:600;cursor:pointer}
    .muted{color:var(--muted)}
    .msg{margin-top:10px;font-size:.95rem}
    .success{color:#83f0a5}.error{color:#ffb4b4}

    footer{margin:40px 0 0;padding:28px 0;border-top:1px solid rgba(141,158,199,.18);color:var(--muted);font-size:14px}
    .footer-links{display:flex;gap:14px;flex-wrap:wrap}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <div class="brand">
      <a href="index.html" aria-label="VetoCos home">
        <img class="brand-logo" src="images/logo.png" alt="VetoCos logo">
      </a>
      <span>VetoCos</span>
    </div>
    <nav class="links">
      <a href="login.html">Have an account? Sign in</a>
      <button class="contact-btn" type="button" onclick="openContact()">Contact</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="box">
    <h1>Create your account</h1>
    <p class="muted">We’ll send a confirmation email — after you confirm, you can sign in with your password.</p>

    <form id="form">
      <div class="row">
        <div><label>First name<input id="first" required autocomplete="given-name" class="input"></label></div>
        <div><label>Last name<input id="last" required autocomplete="family-name" class="input"></label></div>
      </div>
      <div class="row">
        <div><label>Date of birth<input id="dob" type="date" required class="input"></label></div>
        <div><label>Email<input id="email" type="email" required autocomplete="email" class="input"></label></div>
      </div>
      <div class="row">
        <div><label>Password<input id="pw" type="password" required minlength="8" autocomplete="new-password" class="input" placeholder="At least 8 characters"></label></div>
        <div><label>Confirm password<input id="pw2" type="password" required minlength="8" autocomplete="new-password" class="input"></label></div>
      </div>

      <button class="btn" type="submit" id="submit">Create account</button>
      <div id="msg" class="msg" aria-live="polite"></div>
    </form>

    <p class="muted" style="margin-top:14px">By creating an account you agree to the site terms and privacy policy.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    © <span id="y"></span> VetoCos · Complementary feed for companion animals
    <div class="footer-links">
      <a href="#" onclick="openPolicy();return false;">Privacy & Policy</a>
      <a href="#" onclick="openContact();return false;">Contact</a>
    </div>
  </div>
</footer>

<!-- Basic modals (optional minimal) -->
<div id="contactModal" style="display:none"></div>
<div id="policyModal" style="display:none"></div>

<script>
  const supa = supabase.createClient(
    "https://qdepgviimbcdlozjpbhm.supabase.co",
    "sb_publishable_LAWs9kqrkEQibkLYfyNBAA_11pxJSx6",
    { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
  );

  document.getElementById('y').textContent = new Date().getFullYear();

  function openContact(){ alert("Email us at info@vetocos.com"); }
  function openPolicy(){ alert("Privacy policy placeholder"); }

  const form   = document.getElementById('form');
  const first  = document.getElementById('first');
  const last   = document.getElementById('last');
  const dob    = document.getElementById('dob');
  const email  = document.getElementById('email');
  const pw     = document.getElementById('pw');
  const pw2    = document.getElementById('pw2');
  const msg    = document.getElementById('msg');
  const submit = document.getElementById('submit');

  function show(text, kind=""){ msg.textContent=text; msg.className="msg "+kind; }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    show("");
    if (pw.value !== pw2.value){ return show("Passwords do not match.","error"); }
    if (!first.value.trim() || !last.value.trim()){ return show("Please enter your first and last name.","error"); }
    if (!dob.value){ return show("Please select your date of birth.","error"); }

    submit.disabled = true; show("Creating account…");

    const redirectTo = new URL("account.html", location.href).toString() + "#confirmed=1";

    const { data, error } = await supa.auth.signUp({
      email: email.value.trim().toLowerCase(),
      password: pw.value,
      options: {
        emailRedirectTo: redirectTo,
        data: { first_name: first.value.trim(), last_name: last.value.trim(), dob: dob.value }
      }
    });

    submit.disabled = false;

    if (error){ return show(error.message, "error"); }

    // Optional: store profile seed locally; you can sync on first account visit
    const pending = {
      email: email.value.trim().toLowerCase(),
      first_name: first.value.trim(),
      last_name: last.value.trim(),
      dob: dob.value
    };
    try { localStorage.setItem("pending_profile_"+pending.email, JSON.stringify(pending)); } catch{}

    show("Almost done! Check your email and confirm, then sign in with your password.","success");
  });
</script>
</body>
</html>
