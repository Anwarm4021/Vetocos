<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:1120px;margin:40px auto;padding:0 18px}
    h1,h2{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));
         color:var(--text);font-weight:600;cursor:pointer}
    .btn.small{padding:6px 10px;font-size:.9rem}
    .btn.danger{background:linear-gradient(135deg,rgba(255,120,120,.18),rgba(255,80,80,.16))}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted)}
    .hidden{display:none}
    .row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)}
    .bad{background:rgba(255,180,180,.12)}
    .pend{background:rgba(109,213,255,.12)}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    input.qty-edit{width:84px;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
                   background:rgba(255,255,255,.05);color:white;text-align:center}
    input.text, textarea, input[type="file"]{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
                   background:rgba(255,255,255,.05);color:white}
    label.small{font-size:.85rem;color:var(--muted);display:block;margin:6px 0 4px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
    .filelink{font-size:.9rem;color:var(--muted)}
    #toast{position:fixed;right:16px;bottom:16px;background:#18203e;border:1px solid rgba(141,158,199,.25);
           border-radius:12px;padding:10px 14px;color:#fff;max-width:60vw;display:none;z-index:9999}
    #diag{color:var(--muted);font-size:.85rem;white-space:pre-wrap;margin-top:6px}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Admin Dashboard</h1>

  <!-- Auth gate -->
  <div class="card" id="authGate">
    <div id="authMsg" class="muted">Checking session…</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button id="loginBtn" class="btn hidden">Login as Admin</button>
      <button id="logoutBtn" class="btn hidden">Logout</button>
    </div>
    <div id="diag"></div>
  </div>

  <!-- User Approvals (global can_purchase toggle) -->
  <div class="card hidden" id="uaWrap">
    <div class="toolbar">
      <h2>User Approvals</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="uaSearch" class="search" placeholder="Search by name / email">
        <button class="btn small" id="uaRefresh">Refresh</button>
      </div>
    </div>
    <div id="uaMsg" class="muted"></div>
    <div id="uaList"></div>
  </div>

  <!-- Vet applications -->
  <div class="card hidden" id="appsWrap">
    <div class="toolbar">
      <h2>Vet Applications</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="search" class="search" placeholder="Search by name / email / ID#">
        <button class="btn small" id="appsRefresh">Refresh</button>
      </div>
    </div>
    <div id="appsMsg" class="muted"></div>
    <div id="appsList"></div>
  </div>

  <!-- Per-product approvals -->
  <div class="card hidden" id="vpaWrap">
    <div class="toolbar">
      <h2>Per-product Approvals</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="vpaSearch" class="search" placeholder="Search by name / email / SKU">
        <button class="btn small" id="vpaRefresh">Refresh</button>
      </div>
    </div>
    <div id="vpaMsg" class="muted"></div>
    <div id="vpaList"></div>
  </div>

  <!-- Orders (admin quantity + status + email) -->
  <div class="card hidden" id="orderWrap">
    <div class="toolbar">
      <h2>Client Orders</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="orderSearch" class="search" placeholder="Search by client / product SKU">
        <button class="btn small" id="ordersRefresh">Refresh</button>
      </div>
    </div>
    <div id="orderMsg" class="muted"></div>
    <div id="orderList"></div>
  </div>

  <!-- Products (stock & availability + Create & Edit) -->
  <div class="card hidden" id="prodWrap">
    <div class="toolbar">
      <h2>Products</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="prodSearch" class="search" placeholder="Search by name / SKU">
        <button class="btn small" id="prodRefresh">Refresh</button>
      </div>
    </div>

    <!-- Create new product -->
    <div class="card" style="background:rgba(255,255,255,.02)">
      <h3 style="margin:0 0 8px">Create product</h3>
      <div class="grid3">
        <div>
          <label class="small">SKU</label>
          <input id="newSku" class="text" placeholder="e.g., URO-CHIEN">
        </div>
        <div>
          <label class="small">Name</label>
          <input id="newName" class="text" placeholder="Product name">
        </div>
        <div>
          <label class="small">Sort order</label>
          <input id="newSort" class="qty-edit" type="number" value="0" min="0">
        </div>
      </div>
      <div class="grid2" style="margin-top:8px">
        <div>
          <label class="small">Description</label>
          <textarea id="newDesc" rows="2" placeholder="Short description for lists and modal"></textarea>
        </div>
        <div>
          <label class="small">Stock</label>
          <input id="newStock" class="qty-edit" type="number" min="0" value="0">
          <label class="small" style="margin-top:10px"><input id="newAvail" type="checkbox" checked> Available</label>
        </div>
        <div>
          <label class="small">Image (JPG/PNG)</label>
          <input id="newImg" type="file" accept=".jpg,.jpeg,.png">
        </div>
        <div>
          <label class="small">PDF (spec sheet)</label>
          <input id="newPdf" type="file" accept=".pdf">
        </div>
      </div>
      <div style="margin-top:10px">
        <button class="btn small" id="createProdBtn">Create product</button>
        <span id="prodMsg" class="muted" style="margin-left:8px"></span>
      </div>
    </div>

    <!-- Product list -->
    <div id="prodList"></div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ===== Supabase client ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ===== Config ===== */
const DOCS_BUCKET    = "Documents";
const PRODUCT_BUCKET = "ProductFiles";
const ADMIN_EMAILS   = ["Anwar.moumenjamai19@gmail.com"];

/* ===== UI refs ===== */
const authMsg  = document.getElementById("authMsg");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn= document.getElementById("logoutBtn");
const diagEl   = document.getElementById("diag");
const toastEl  = document.getElementById("toast");

/* user approvals */
const uaWrap = document.getElementById("uaWrap");
const uaList = document.getElementById("uaList");
const uaMsg  = document.getElementById("uaMsg");
const uaSearch = document.getElementById("uaSearch");
const uaRefresh= document.getElementById("uaRefresh");

/* vet apps */
const appsWrap = document.getElementById("appsWrap");
const appsList = document.getElementById("appsList");
const appsMsg  = document.getElementById("appsMsg");
const appsSearch = document.getElementById("search");
const appsRefresh = document.getElementById("appsRefresh");

/* per-product approvals */
const vpaWrap  = document.getElementById("vpaWrap");
const vpaList  = document.getElementById("vpaList");
const vpaMsg   = document.getElementById("vpaMsg");
const vpaSearch= document.getElementById("vpaSearch");
const vpaRefresh = document.getElementById("vpaRefresh");

/* orders */
const orderWrap  = document.getElementById("orderWrap");
const orderList  = document.getElementById("orderList");
const orderMsg   = document.getElementById("orderMsg");
const orderSearch= document.getElementById("orderSearch");
const ordersRefresh = document.getElementById("ordersRefresh");

/* products */
const prodWrap = document.getElementById("prodWrap");
const prodList = document.getElementById("prodList");
const prodMsg  = document.getElementById("prodMsg");
const prodSearch  = document.getElementById("prodSearch");
const prodRefresh = document.getElementById("prodRefresh");

/* ===== Helpers ===== */
function setGate(t,{showLogin=false,showLogout=false}={}) {
  authMsg.textContent = t;
  loginBtn.classList.toggle("hidden", !showLogin);
  logoutBtn.classList.toggle("hidden", !showLogout);
}
function fullName(p){ return [p?.first_name, p?.last_name].filter(Boolean).join(" ") || "(unknown)"; }
function pill(s){ return `<span class="pill ${s==="approved"?"ok":s==="rejected"?"bad":"pend"}">${s||"pending"}</span>`; }
function diag(label, obj){ diagEl.textContent += `\n${label}: ${JSON.stringify(obj)}`; }
function toast(msg, isErr=false){
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  toastEl.style.borderColor = isErr ? "rgba(255,120,120,.4)" : "rgba(141,158,199,.25)";
  clearTimeout(toast._t); toast._t = setTimeout(()=> toastEl.style.display="none", 2200);
}

/* ===== Email helper (Edge Function) ===== */
async function sendApprovalEmail(to, subject, text){
  if(!to) return;
  try { await supa.functions.invoke('send-email', { body: { to, subject, text }}); }
  catch(e){ console.warn('send-email failed', e); }
}

/* ===== Auth buttons ===== */
loginBtn.onclick = () => {
  const u = new URL("login.html", location.href);
  u.searchParams.set("redirect", "admin.html");
  u.searchParams.set("force", "1");
  location.href = u.toString();
};
logoutBtn.onclick = async () => { await supa.auth.signOut(); location.reload(); };

/* ===== Admin check ===== */
async function checkAdmin(){
  setGate("Checking session…");
  const { data:{ session }, error } = await supa.auth.getSession();
  if (error) diag("getSession error", error);
  if (!session?.user){ setGate("Not signed in.", { showLogin:true }); return false; }
  setGate(`Signed in as ${session.user.email}`, { showLogout:true });

  if (ADMIN_EMAILS.includes(session.user.email)){
    [uaWrap, appsWrap, vpaWrap, orderWrap, prodWrap].forEach(el=>el.classList.remove("hidden"));
    return true;
  }
  const { data: prof, error: pe } = await supa
    .from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
  if (pe){ setGate("Profile read error.", { showLogout:true }); toast(pe.message, true); return false; }
  if (!prof?.is_admin){ setGate("Access denied.", { showLogout:true }); return false; }
  [uaWrap, appsWrap, vpaWrap, orderWrap, prodWrap].forEach(el=>el.classList.remove("hidden"));
  return true;
}

/* =======================================================================
   USER APPROVALS (toggle profiles.can_purchase)
======================================================================= */
let uaRows=[];
async function loadUserApprovals(){
  uaMsg.textContent = "Loading…";
  const { data, error } = await supa
    .from("profiles")
    .select("id,first_name,last_name,email,can_purchase")
    .order("last_name", { ascending: true });
  if (error){ uaMsg.textContent = error.message; toast(error.message, true); return; }
  uaRows = data || [];
  renderUA();
  uaMsg.textContent = uaRows.length ? "" : "No users.";
}
function renderUA(){
  const q=(uaSearch.value||"").toLowerCase();
  uaList.innerHTML = "";
  uaRows.filter(p=>{
    const name = [p.first_name, p.last_name].filter(Boolean).join(' ');
    return !q || name.toLowerCase().includes(q) || (p.email||"").toLowerCase().includes(q);
  }).forEach(p=>{
    const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || '(no name)';
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:center">
        <div>
          <div style="font-weight:600">${name}</div>
          <div class="muted">${p.email||''}</div>
        </div>
        <div>${p.can_purchase ? '<span class="pill ok">Approved</span>' : '<span class="pill pend">Needs approval</span>'}</div>
        <div style="display:flex;gap:6px">
          <button class="btn small" data-action="ua-approve" data-id="${p.id}" data-email="${p.email||''}">Approve</button>
          <button class="btn small" data-action="ua-revoke"  data-id="${p.id}" data-email="${p.email||''}">Revoke</button>
        </div>
      </div>`;
    uaList.appendChild(el);
  });
}
uaList.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const approve = btn.dataset.action === "ua-approve";
  const { error } = await supa.from('profiles').update({ can_purchase: approve }).eq('id', btn.dataset.id);
  if (error){ toast(error.message, true); return; }
  toast(approve ? "User approved" : "Approval revoked");
  if (approve && btn.dataset.email){
    await sendApprovalEmail(
      btn.dataset.email,
      "Your VetoCos account has been approved",
      "Hi,\n\nYour account has been approved. You can purchase without additional approvals now.\n\nThank you,\nVetoCos"
    );
  }
  await loadUserApprovals();
});

/* =======================================================================
   VET APPLICATIONS
======================================================================= */
let apps = [], profMap = {};
async function loadApps(){
  appsMsg.textContent = "Loading…";
  const { data, error } = await supa.from("vet_applications")
    .select("id,user_id,identity_number,diploma_path,status,created_at")
    .order("created_at",{ascending:true});
  if (error){ appsMsg.textContent = error.message; toast(error.message, true); return; }
  apps = data || [];
  const ids = [...new Set(apps.map(a=>a.user_id))];
  profMap = {};
  if (ids.length){
    const { data: profs, error: pe } = await supa
      .from("profiles").select("id,first_name,last_name,email").in("id", ids);
    if (pe) toast(pe.message, true);
    (profs||[]).forEach(p=> profMap[p.id]=p);
  }
  renderApps();
  appsMsg.textContent = apps.length ? "" : "No applications.";
}
function renderApps(){
  const q = (appsSearch.value||"").toLowerCase();
  appsList.innerHTML = "";
  apps.filter(a=>{
    if(!q) return true;
    const p = profMap[a.user_id]||{};
    return fullName(p).toLowerCase().includes(q) ||
           (p.email||"").toLowerCase().includes(q) ||
           (a.identity_number||"").toLowerCase().includes(q);
  }).forEach(a=>{
    const p = profMap[a.user_id]||{};
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="row">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||""}</div>
          <div><strong>ID#:</strong> ${a.identity_number||"-"}</div>
          <div class="muted">Status: ${pill(a.status)}</div>
          <div class="muted">Submitted: ${new Date(a.created_at).toLocaleString()}</div>
        </div>
        <div><button class="btn" data-action="app-view" data-path="${a.diploma_path||""}">Diploma</button></div>
        <div><button class="btn" data-action="app-approve" data-id="${a.id}">Approve</button></div>
        <div><button class="btn" data-action="app-reject"  data-id="${a.id}">Reject</button></div>
        <div><button class="btn danger small" data-action="app-delete" data-id="${a.id}">Delete</button></div>
      </div>`;
    appsList.appendChild(el);
  });
}
appsList.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === "app-view"){
    const { data, error } = await supa.storage.from(DOCS_BUCKET).createSignedUrl(btn.dataset.path, 300);
    if (error){ toast(error.message, true); return; }
    window.location.assign(data.signedUrl);
  }

  if(action === "app-approve" || action === "app-reject"){
    const status = action==="app-approve" ? "approved" : "rejected";
    const { error } = await supa.from("vet_applications").update({status}).eq("id", btn.dataset.id);
    if (error){ toast(error.message, true); return; }
    toast(status==="approved" ? "Application approved" : "Application rejected");
    await loadApps();
  }

  if(action === "app-delete"){
    if(!confirm("Delete this application permanently?")) return;
    const { error } = await supa.from("vet_applications").delete().eq("id", btn.dataset.id);
    if (error) toast(error.message, true); else toast("Application deleted");
    await loadApps();
  }
});

/* =======================================================================
   PER-PRODUCT APPROVALS (with quantity edit)
======================================================================= */
let vpaRows=[], vpaProfiles={}, vpaProducts={};
async function loadProductApprovals(){
  vpaMsg.textContent = "Loading…";
  const { data, error } = await supa
    .from("vet_product_approvals")
    .select("id,user_id,product_sku,quantity,status,created_at")
    .order("created_at",{ascending:true});
  if (error){ vpaMsg.textContent = error.message; toast(error.message, true); return; }
  vpaRows = data || [];

  const uids = [...new Set(vpaRows.map(r=>r.user_id))];
  const skus = [...new Set(vpaRows.map(r=>r.product_sku))];

  if (uids.length){
    const { data: profs, error: pe } = await supa
      .from("profiles").select("id,first_name,last_name,email").in("id", uids);
    if (pe) toast(pe.message, true);
    vpaProfiles={}; (profs||[]).forEach(p=> vpaProfiles[p.id]=p);
  }
  if (skus.length){
    const { data: prods, error: prErr } = await supa
      .from("products").select("sku,name").in("sku", skus);
    if (prErr) toast(prErr.message, true);
    vpaProducts={}; (prods||[]).forEach(p=> vpaProducts[p.sku]=p.name);
  }

  renderVPA();
  vpaMsg.textContent = vpaRows.length ? "" : "No per-product requests.";
}
function renderVPA(){
  const q=(vpaSearch.value||"").toLowerCase();
  vpaList.innerHTML = "";
  vpaRows.filter(r=>{
    if(!q) return true;
    const p=vpaProfiles[r.user_id]||{};
    const prod=vpaProducts[r.product_sku]||r.product_sku;
    return fullName(p).toLowerCase().includes(q) ||
           (p.email||"").toLowerCase().includes(q) ||
           prod.toLowerCase().includes(q) ||
           (r.product_sku||"").toLowerCase().includes(q);
  }).forEach(r=>{
    const p=vpaProfiles[r.user_id]||{};
    const prod=vpaProducts[r.product_sku]||r.product_sku;
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <div style="display:grid;grid-template-columns:2fr 2fr 1.6fr 1fr 1.6fr;gap:10px;align-items:center">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||""}</div>
        </div>

        <div>${prod} <span class="muted">(${r.product_sku})</span></div>

        <div>
          <label class="muted" style="display:block;font-size:.85rem">Quantity</label>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn small" data-action="vpa-dec" data-id="${r.id}">−</button>
            <input id="qty-${r.id}" class="qty-edit" type="number" min="1" value="${Number(r.quantity)||1}">
            <button class="btn small" data-action="vpa-inc" data-id="${r.id}">+</button>
          </div>
        </div>

        <div>${pill(r.status)}</div>

        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn small" data-action="vpa-save"    data-id="${r.id}">Save qty</button>
          <button class="btn small" data-action="vpa-approve" data-id="${r.id}">Approve</button>
          <button class="btn small" data-action="vpa-reject"  data-id="${r.id}">Reject</button>
          <button class="btn danger small" data-action="vpa-delete" data-id="${r.id}">Delete</button>
        </div>
      </div>`;
    vpaList.appendChild(el);
  });
}
vpaList.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const { action, id } = btn.dataset;

  if(action==="vpa-inc" || action==="vpa-dec"){
    const el = document.getElementById(`qty-${id}`);
    if (!el) return;
    const delta = action==="vpa-inc" ? 1 : -1;
    el.value = Math.max(1, Number(el.value || 1) + delta);
    return;
  }

  if(action==="vpa-save"){
    const el = document.getElementById(`qty-${id}`);
    if (!el) return alert('Quantity input not found.');
    const qty = Math.max(1, Number(el.value || 1));
    const { error } = await supa.from('vet_product_approvals').update({ quantity: qty }).eq('id', id);
    if (error) toast(error.message, true); else toast('Quantity saved');
    await loadProductApprovals();
    return;
  }

  if(action==="vpa-approve" || action==="vpa-reject"){
    const status = action==="vpa-approve" ? "approved" : "rejected";
    const { error } = await supa.from("vet_product_approvals").update({status}).eq("id",id);
    if (error){ toast(error.message, true); return; }
    toast(status==="approved" ? "SKU approved" : "SKU rejected");
    await loadProductApprovals();
    return;
  }

  if(action==="vpa-delete"){
    if(!confirm("Delete this approval request?")) return;
    const { error } = await supa.from("vet_product_approvals").delete().eq("id",id);
    if (error) toast(error.message, true); else toast("Request deleted");
    await loadProductApprovals();
  }
});

/* =======================================================================
   ORDERS (Admin quantity + approve/reject + email)
======================================================================= */
let orders=[], ordProfiles={}, ordProducts={};
async function loadOrders(){
  orderMsg.textContent = "Loading…";
  const { data, error } = await supa.from("orders")
    .select("id,user_id,product_sku,quantity,status,created_at")
    .order("created_at",{ascending:false});
  if (error){ orderMsg.textContent = error.message; toast(error.message, true); return; }
  orders = data || [];

  const uids=[...new Set(orders.map(o=>o.user_id))];
  const skus=[...new Set(orders.map(o=>o.product_sku))];

  if(uids.length){
    const { data:p, error:pe } = await supa.from("profiles").select("id,first_name,last_name,email").in("id",uids);
    if (pe) toast(pe.message, true);
    (p||[]).forEach(x=>ordProfiles[x.id]=x);
  }
  if(skus.length){
    const { data:p2, error:pe2 } = await supa.from("products").select("sku,name").in("sku",skus);
    if (pe2) toast(pe2.message, true);
    (p2||[]).forEach(x=>ordProducts[x.sku]=x.name);
  }

  renderOrders();
  orderMsg.textContent = orders.length ? "" : "No orders.";
}
function renderOrders(){
  const q=(orderSearch.value||"").toLowerCase();
  orderList.innerHTML="";
  orders.filter(o=>{
    const p=ordProfiles[o.user_id]||{};
    const prod=ordProducts[o.product_sku]||o.product_sku;
    return !q || fullName(p).toLowerCase().includes(q) ||
                 (p.email||"").toLowerCase().includes(q) ||
                 prod.toLowerCase().includes(q) ||
                 (o.product_sku||"").toLowerCase().includes(q);
  }).forEach(o=>{
    const p=ordProfiles[o.user_id]||{};
    const prod=ordProducts[o.product_sku]||o.product_sku;
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <div style="display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1.6fr;gap:10px;align-items:center">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||""}</div>
        </div>
        <div>${prod} <span class="muted">(${o.product_sku})</span></div>
        <div>
          <label class="muted" style="display:block;font-size:.85rem">Qty</label>
          <input class="qty-edit" id="q_${o.id}" type="number" min="1" value="${o.quantity}">
        </div>
        <div>${pill(o.status)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn small" data-action="ord-save" data-id="${o.id}">Save</button>
          <button class="btn small" data-action="ord-approve" data-id="${o.id}">Approve</button>
          <button class="btn small" data-action="ord-reject" data-id="${o.id}">Reject</button>
          <button class="btn danger small" data-action="ord-delete" data-id="${o.id}">Delete</button>
        </div>
      </div>`;
    orderList.appendChild(el);
  });
}
orderList.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const { action, id } = btn.dataset;
  const row = orders.find(o=>o.id===id);
  const prof = row ? ordProfiles[row.user_id] : null;

  if(action==="ord-save"){
    const input = document.getElementById("q_"+id);
    const val = Number(input?.value||0);
    if(!val || val<1) return toast("Invalid quantity", true);
    const { error } = await supa.from("orders").update({ quantity: val }).eq("id", id);
    if (error) toast(error.message, true); else toast("Quantity updated");
    await loadOrders();
    return;
  }

  if(action==="ord-approve" || action==="ord-reject"){
    const status = action==="ord-approve" ? "approved" : "rejected";
    const { error } = await supa.from("orders").update({ status }).eq("id", id);
    if (error){ toast(error.message, true); return; }
    toast(status==="approved"?"Order approved":"Order rejected");
    if (prof?.email){
      await sendApprovalEmail(
        prof.email,
        status==="approved" ? "Your VetoCos order was approved" : "Your VetoCos order was rejected",
        status==="approved"
          ? `Hi,\n\nYour order for ${row.product_sku} (qty ${row.quantity}) has been approved and will be processed.\n\nThank you,\nVetoCos`
          : `Hi,\n\nUnfortunately your order for ${row.product_sku} (qty ${row.quantity}) was rejected. If you believe this is an error, please contact support.\n\nThank you,\nVetoCos`
      );
    }
    await loadOrders();
    return;
  }

  if(action==="ord-delete"){
    if(!confirm("Delete this order permanently?")) return;
    const { error } = await supa.from("orders").delete().eq("id", id);
    if (error) toast(error.message, true); else toast("Order deleted");
    await loadOrders();
  }
});

/* =======================================================================
   PRODUCTS (Create + Edit: name, description, sort order, stock, availability, image/PDF)
======================================================================= */
let products = [];
function publicUrl(path){
  return `https://qdepgviimbcdlozjpbhm.supabase.co/storage/v1/object/public/${PRODUCT_BUCKET}/${encodeURI(path.replace(/^ProductFiles\//,''))}`;
}

async function loadProducts(){
  prodMsg.textContent = "Loading…";
  const { data, error } = await supa.from("products")
    .select("sku,name,description,stock_qty,available,image_path,pdf_path,sort_order,updated_at")
    .order("sort_order", { ascending:true, nullsFirst:false })
    .order("name", { ascending:true });
  if (error){ prodMsg.textContent = error.message; toast(error.message, true); return; }
  products = data || [];
  renderProducts();
  prodMsg.textContent = products.length ? "" : "No products.";
}

function renderProducts(){
  const q=(prodSearch.value||"").toLowerCase();
  prodList.innerHTML="";
  products.filter(p=>{
    return !q || (p.name||"").toLowerCase().includes(q) || (p.sku||"").toLowerCase().includes(q);
  }).forEach(p=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <div><strong>${p.name||p.sku}</strong> <span class="muted">(${p.sku})</span></div>
        <div class="muted">Updated: ${p.updated_at ? new Date(p.updated_at).toLocaleString() : "-"}</div>
      </div>

      <div class="grid3" style="margin-top:10px">
        <div>
          <label class="small">Name</label>
          <input class="text" id="nm_${p.sku}" value="${(p.name||'').replace(/"/g,'&quot;')}">
        </div>
        <div>
          <label class="small">Sort order</label>
          <input class="qty-edit" id="so_${p.sku}" type="number" min="0" value="${Number(p.sort_order)||0}">
        </div>
        <div>
          <label class="small">Stock</label>
          <input class="qty-edit" id="q_${p.sku}" type="number" min="0" value="${Number(p.stock_qty)||0}">
          <label class="small" style="margin-top:8px"><input id="av_${p.sku}" type="checkbox" ${p.available?'checked':''}> Available</label>
        </div>
      </div>

      <div class="grid2" style="margin-top:8px">
        <div>
          <label class="small">Description</label>
          <textarea id="ds_${p.sku}" rows="2">${(p.description||'')}</textarea>
        </div>
        <div>
          <label class="small">Image (JPG/PNG)</label>
          <input type="file" id="img_${p.sku}" accept=".jpg,.jpeg,.png">
          ${p.image_path ? `<div style="margin-top:6px"><a class="filelink" href="${publicUrl(p.image_path)}" target="_blank">Current image</a></div>`:''}
          <label class="small" style="margin-top:10px">PDF (spec)</label>
          <input type="file" id="pdf_${p.sku}" accept=".pdf">
          ${p.pdf_path ? `<div style="margin-top:6px"><a class="filelink" href="${publicUrl(p.pdf_path)}" target="_blank">Current PDF</a></div>`:''}
        </div>
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
        <button class="btn small" data-action="prod-save" data-sku="${p.sku}">Save</button>
        <button class="btn small" data-action="prod-upload-img" data-sku="${p.sku}">Upload image</button>
        <button class="btn small" data-action="prod-upload-pdf" data-sku="${p.sku}">Upload PDF</button>
      </div>`;
    prodList.appendChild(el);
  });
}

/* Create new product */
const newSku = document.getElementById("newSku");
const newName = document.getElementById("newName");
const newSort = document.getElementById("newSort");
const newDesc = document.getElementById("newDesc");
const newStock = document.getElementById("newStock");
const newAvail = document.getElementById("newAvail");
const newImg = document.getElementById("newImg");
const newPdf = document.getElementById("newPdf");
const createProdBtn = document.getElementById("createProdBtn");

createProdBtn.onclick = async ()=>{
  const sku = (newSku.value||"").trim();
  const name = (newName.value||"").trim();
  if(!sku || !name) { prodMsg.textContent = "SKU and Name are required."; return; }
  prodMsg.textContent = "Creating…";

  const body = {
    sku, name,
    description: (newDesc.value||"").trim() || null,
    sort_order: Math.max(0, Number(newSort.value||0)),
    stock_qty:  Math.max(0, Number(newStock.value||0)),
    available: !!newAvail.checked
  };
  const { error } = await supa.from("products").insert(body);
  if (error){ prodMsg.textContent = error.message; toast(error.message, true); return; }

  // Upload files if present, then patch record
  if(newImg.files[0]) await uploadFileForSku(sku, newImg.files[0], 'image');
  if(newPdf.files[0]) await uploadFileForSku(sku, newPdf.files[0], 'pdf');

  prodMsg.textContent = "Created.";
  newSku.value=""; newName.value=""; newDesc.value=""; newSort.value="0"; newStock.value="0"; newAvail.checked=true; newImg.value=""; newPdf.value="";
  await loadProducts();
};

async function uploadFileForSku(sku, file, kind){
  if(!file) return;
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  const path = `${sku}/${kind==='image' ? `image.${ext||'jpg'}` : `spec.${ext||'pdf'}`}`;
  const up = await supa.storage.from(PRODUCT_BUCKET).upload(path, file, { upsert:true, cacheControl:"3600", contentType: file.type || "application/octet-stream" });
  if(up.error){ toast(up.error.message, true); return; }
  const patch = (kind==='image') ? { image_path: path } : { pdf_path: path };
  const { error } = await supa.from("products").update(patch).eq("sku", sku);
  if (error) toast(error.message, true); else toast(kind==='image'?"Image uploaded":"PDF uploaded");
}

/* Edit events */
prodList.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const sku = btn.dataset.sku;
  const action = btn.dataset.action;

  if(action==="prod-save"){
    const body = {
      name:        document.getElementById(`nm_${sku}`).value.trim() || null,
      description: document.getElementById(`ds_${sku}`).value.trim() || null,
      sort_order:  Math.max(0, Number(document.getElementById(`so_${sku}`).value||0)),
      stock_qty:   Math.max(0, Number(document.getElementById(`q_${sku}`).value||0)),
      available:   document.getElementById(`av_${sku}`).checked
    };
    const { error } = await supa.from("products").update(body).eq("sku", sku);
    if (error) toast(error.message, true); else toast("Saved");
    await loadProducts();
  }

  if(action==="prod-upload-img"){
    const f = document.getElementById(`img_${sku}`)?.files?.[0];
    if(!f) return toast("Choose an image first", true);
    await uploadFileForSku(sku, f, 'image');
    await loadProducts();
  }

  if(action==="prod-upload-pdf"){
    const f = document.getElementById(`pdf_${sku}`)?.files?.[0];
    if(!f) return toast("Choose a PDF first", true);
    await uploadFileForSku(sku, f, 'pdf');
    await loadProducts();
  }
});

});
