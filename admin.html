<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:1080px;margin:40px auto;padding:0 18px}
    h1{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted)}
    .hidden{display:none}
    .row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)} .bad{background:rgba(255,180,180,.12)} .pend{background:rgba(109,213,255,.12)}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    .diag{color:var(--muted);font-size:.85rem;white-space:pre-wrap;margin-top:6px}
    .diag.err{color:#ffb4b4}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <h1>Admin – Vet Applications</h1>

    <div class="card" id="authGate">
      <div id="authMsg" class="muted">Checking session…</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button id="loginBtn" class="btn hidden">Login as Admin</button>
        <button id="logoutBtn" class="btn hidden">Logout</button>
      </div>
      <div id="diag" class="diag"></div>
    </div>

    <div class="card hidden" id="listWrap">
      <div class="toolbar">
        <div id="msg" class="muted"></div>
        <input id="search" class="search" placeholder="Search by name / email / ID#">
      </div>
      <div id="list"></div>
    </div>
  </main>

<script>
/* ===== Supabase client ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ===== Config ===== */
const BUCKET = 'Documents';                // exact case
const ADMIN_EMAILS = [                     // TEMP fallback whitelist (edit/remove in prod)
  'admin@vetocos.com'
];

/* ===== UI refs ===== */
const authMsg  = document.getElementById('authMsg');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn= document.getElementById('logoutBtn');
const listWrap = document.getElementById('listWrap');
const msgEl    = document.getElementById('msg');
const listEl   = document.getElementById('list');
const searchEl = document.getElementById('search');
const diagEl   = document.getElementById('diag');

/* ===== Helpers ===== */
function setGate(text,{showLogin=false,showLogout=false}={}) {
  authMsg.textContent = text;
  loginBtn.classList.toggle('hidden', !showLogin);
  logoutBtn.classList.toggle('hidden', !showLogout);
}
function show(t){ msgEl.textContent = t || ''; }
function fullName(p){ return p?.full_name || [p?.first_name,p?.last_name].filter(Boolean).join(' ') || '(unknown)'; }
function pill(s){ return `<span class="pill ${s==='approved'?'ok':s==='rejected'?'bad':'pend'}">${s||'pending'}</span>`; }
function diag(label, obj, isError=false){
  const line = document.createElement('div');
  line.className = 'diag' + (isError ? ' err' : '');
  line.textContent = `${isError ? '✗' : '✓'} ${label}: ${JSON.stringify(obj, null, 2)}`;
  diagEl.appendChild(line);
}

/* ===== Error taps to page too ===== */
window.addEventListener('error', e => diag('Window error', {message:e.message}, true));
window.addEventListener('unhandledrejection', e => diag('Unhandled rejection', {reason:String(e.reason)}, true));

/* ===== Buttons ===== */
loginBtn.onclick = () => {
  const target = new URL('login.html', location.href);
  target.searchParams.set('redirect', 'admin.html');
  target.searchParams.set('force', '1');
  location.href = target.toString();
};
logoutBtn.onclick = async () => { await supa.auth.signOut(); location.reload(); };

/* ===== State ===== */
let apps = []; let profMap = {};

/* ===== Admin check ===== */
async function checkAdmin(){
  setGate('Checking session…');

  // Force a fresh read (useful right after magic-link)
  const g = await supa.auth.getSession();
  const session = g?.data?.session || null;
  diag('getSession()', { hasSession: !!session?.user, error: g?.error?.message || null }, !!g?.error);

  if (!session?.user) { setGate('You are not signed in here. Click Login.', { showLogin:true }); return false; }

  setGate(`Signed in as ${session.user.email || session.user.id}`, { showLogout:true });

  // TEMP: fallback whitelist by email so you can proceed even if profile policy blocks
  const email = session.user.email || '';
  if (ADMIN_EMAILS.includes(email)) {
    diag('admin fallback', { via: 'ADMIN_EMAILS', email });
    listWrap.classList.remove('hidden'); 
    return true;
  }

  // Normal admin flag check
  const { data: prof, error: profErr } = await supa
    .from('profiles')
    .select('is_admin')
    .eq('id', session.user.id)
    .maybeSingle();

  diag('profiles (admin check)', { is_admin: prof?.is_admin ?? null, error: profErr?.message || null }, !!profErr);

  if (profErr) { setGate('Cannot read profile (RLS/policy).', { showLogout:true }); return false; }
  if (!prof?.is_admin) { setGate('Access denied. Admins only.', { showLogout:true }); return false; }

  listWrap.classList.remove('hidden');
  return true;
}

/* ===== Load + render apps ===== */
async function loadApps(){
  show('Loading applications…');

  const { data, error } = await supa
    .from('vet_applications')
    .select('id,user_id,identity_number,diploma_path,status,created_at')
    .order('created_at',{ascending:true});

  diag('vet_applications select', { count: data?.length || 0, error: error?.message || null }, !!error);

  if (error) { show(error.message); return; }
  apps = data || [];

  const ids = [...new Set(apps.map(a=>a.user_id))];
  profMap = {};
  if (ids.length){
    const { data: profs, error: pErr } = await supa
      .from('profiles')
      .select('id,first_name,last_name,full_name,email')
      .in('id', ids);

    diag('profiles batch', { count: profs?.length || 0, error: pErr?.message || null }, !!pErr);
    (profs||[]).forEach(p=>profMap[p.id]=p);
  }

  render();
  show(apps.length ? '' : 'No applications yet.');
}

function render(){
  const q = (searchEl?.value||'').toLowerCase().trim();
  listEl.innerHTML = '';

  (apps||[]).filter(a=>{
    if(!q) return true;
    const p = profMap[a.user_id]||{};
    return (fullName(p).toLowerCase().includes(q) ||
            (p.email||'').toLowerCase().includes(q) ||
            (a.identity_number||'').toLowerCase().includes(q));
  }).forEach(a=>{
    const p = profMap[a.user_id]||{};
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="row">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||''}</div>
          <div><strong>ID#:</strong> ${a.identity_number||'-'}</div>
          <div class="muted">User: ${a.user_id}</div>
          <div class="muted">Status: ${pill(a.status)}</div>
          <div class="muted">Submitted: ${new Date(a.created_at).toLocaleString()}</div>
        </div>
        <div><button class="btn" onclick="viewDiploma('${a.diploma_path||''}')">View diploma</button></div>
        <div><button class="btn" ${a.status==='approved'?'disabled':''} onclick="approve('${a.id}')">Approve</button></div>
        <div><button class="btn" ${a.status==='rejected'?'disabled':''} onclick="reject('${a.id}')">Reject</button></div>
      </div>`;
    listEl.appendChild(div);
  });
}

/* ===== Actions ===== */
async function viewDiploma(path){
  if(!path) return alert('No file path saved.');
  const { data, error } = await supa.storage.from(BUCKET).createSignedUrl(path, 60*5);
  diag('createSignedUrl', { ok: !error, error: error?.message || null }, !!error);
  if(error) return alert(error.message);
  window.open(data.signedUrl, '_blank');
}

async function approve(id){
  const { data: row, error: e1 } = await supa.from('vet_applications').select('user_id').eq('id', id).maybeSingle();
  diag('approve: fetch row', { ok: !!row, error: e1?.message || null }, !!e1);
  if(e1 || !row) return alert(e1?.message || 'Not found');
  const { error } = await supa.from('vet_applications').update({status:'approved'}).eq('id', id);
  diag('approve: update', { ok: !error, error: error?.message || null }, !!error);
  if(error) return alert(error.message);
  try { await supa.from('buyers_log').insert({application_id:id,user_id:row.user_id}); } catch(e){}
  await loadApps();
}

async function reject(id){
  const { error } = await supa.from('vet_applications').update({status:'rejected'}).eq('id', id);
  diag('reject: update', { ok: !error, error: error?.message || null }, !!error);
  if(error) return alert(error.message);
  await loadApps();
}

/* ===== Auth change handling ===== */
supa.auth.onAuthStateChange(async (evt, session)=>{
  diag('onAuthStateChange', { evt, hasUser: !!session?.user });
  if(evt==='SIGNED_IN'){
    // Force a new getSession after hash is consumed
    setTimeout(async ()=>{
      const s = await supa.auth.getSession();
      diag('post SIGNED_IN getSession()', { hasSession: !!s?.data?.session?.user, error:s?.error?.message || null }, !!s?.error);
      setGate(`Signed in as ${session.user.email||session.user.id}`, {showLogout:true});
      if(await checkAdmin()) await loadApps();
    }, 50);
  }
  if(evt==='SIGNED_OUT'){
    setGate('You are not signed in.', {showLogin:true});
    listWrap.classList.add('hidden');
  }
});

/* ===== Boot ===== */
document.addEventListener('DOMContentLoaded', async ()=>{
  const ok = await checkAdmin();
  if (ok) await loadApps();

  // If still no session after magic-link processing, show Login
  setTimeout(async ()=>{
    const { data:{ session } } = await supa.auth.getSession();
    if (!session?.user) setGate('No active session here. Tap Login to sign in on this origin.', { showLogin:true });
  }, 1500);

  searchEl?.addEventListener('input', render);
});
</script>
</body>
</html>
