<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:1080px;margin:40px auto;padding:0 18px}
    h1,h2{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));
         color:var(--text);font-weight:600;cursor:pointer}
    .btn.small{padding:6px 10px}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted)}
    .hidden{display:none}
    .row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)} .bad{background:rgba(255,180,180,.12)} .pend{background:rgba(109,213,255,.12)}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    .diag{color:var(--muted);font-size:.85rem;white-space:pre-wrap;margin-top:6px}
    .diag.err{color:#ffb4b4}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Admin Dashboard</h1>

  <!-- Auth gate -->
  <div class="card" id="authGate">
    <div id="authMsg" class="muted">Checking session…</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button id="loginBtn" class="btn hidden">Login as Admin</button>
      <button id="logoutBtn" class="btn hidden">Logout</button>
    </div>
    <div id="diag" class="diag"></div>
  </div>

  <!-- Vet applications -->
  <div class="card hidden" id="listWrap">
    <div class="toolbar">
      <h2>Vet Applications</h2>
      <input id="search" class="search" placeholder="Search by name / email / ID#">
    </div>
    <div id="msg" class="muted"></div>
    <div id="list"></div>
  </div>

  <!-- Per-product approvals -->
  <div class="card hidden" id="vpaWrap">
    <div class="toolbar">
      <h2>Per-product Approvals</h2>
      <input id="vpaSearch" class="search" placeholder="Search by name / email / SKU">
    </div>
    <div id="vpaMsg" class="muted"></div>
    <div id="vpaList"></div>
  </div>
</main>

<script>
/* ===== Supabase client ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0"
);

/* ===== Config ===== */
const BUCKET = 'Documents';
const ADMIN_EMAILS = ['Anwar.moumenjamai19@gmail.com'];

/* ===== UI refs ===== */
const authMsg  = document.getElementById('authMsg');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn= document.getElementById('logoutBtn');
const diagEl   = document.getElementById('diag');
const listWrap = document.getElementById('listWrap');
const msgEl    = document.getElementById('msg');
const listEl   = document.getElementById('list');
const searchEl = document.getElementById('search');
const vpaWrap  = document.getElementById('vpaWrap');
const vpaList  = document.getElementById('vpaList');
const vpaMsg   = document.getElementById('vpaMsg');
const vpaSearch= document.getElementById('vpaSearch');

/* ===== Helpers ===== */
function setGate(text,{showLogin=false,showLogout=false}={}) {
  authMsg.textContent = text;
  loginBtn.classList.toggle('hidden', !showLogin);
  logoutBtn.classList.toggle('hidden', !showLogout);
}
function show(t){ msgEl.textContent = t || ''; }
function fullName(p){ return p?.full_name || [p?.first_name,p?.last_name].filter(Boolean).join(' ') || '(unknown)'; }
function pill(s){ return `<span class="pill ${s==='approved'?'ok':s==='rejected'?'bad':'pend'}">${s||'pending'}</span>`; }
function diag(label,obj,isErr=false){
  const d=document.createElement('div');
  d.className='diag'+(isErr?' err':'');
  d.textContent=`${isErr?'✗':'✓'} ${label}: ${JSON.stringify(obj,null,2)}`;
  diagEl.appendChild(d);
}

/* ===== Auth buttons ===== */
loginBtn.onclick = ()=>{
  const u=new URL('login.html',location.href);
  u.searchParams.set('redirect','admin.html');
  u.searchParams.set('force','1');
  location.href=u.toString();
};
logoutBtn.onclick=async()=>{await supa.auth.signOut();location.reload();};

/* ===== Admin check ===== */
async function checkAdmin(){
  setGate('Checking session…');
  const { data:{ session }, error } = await supa.auth.getSession();
  diag('getSession()', { hasSession: !!session?.user, error: error?.message || null }, !!error);
  if(!session?.user){ setGate('Not signed in.',{showLogin:true}); return false; }
  setGate(`Signed in as ${session.user.email}`,{showLogout:true});
  const email=session.user.email||'';
  if(ADMIN_EMAILS.includes(email)){ listWrap.classList.remove('hidden'); vpaWrap.classList.remove('hidden'); return true; }
  const { data: prof, error: pe } = await supa.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
  if(pe){ setGate('Profile read error.',{showLogout:true}); return false; }
  if(!prof?.is_admin){ setGate('Access denied.',{showLogout:true}); return false; }
  listWrap.classList.remove('hidden'); vpaWrap.classList.remove('hidden');
  return true;
}

/* ===== Load Vet Applications ===== */
let apps=[]; let profMap={};
async function loadApps(){
  show('Loading applications…');
  const { data, error } = await supa.from('vet_applications')
    .select('id,user_id,identity_number,diploma_path,status,created_at')
    .order('created_at',{ascending:true});
  diag('vet_applications select',{count:data?.length||0,error:error?.message||null},!!error);
  if(error){ show(error.message);return; }
  apps=data||[];
  const ids=[...new Set(apps.map(a=>a.user_id))];
  profMap={};
  if(ids.length){
    const { data: profs } = await supa.from('profiles').select('id,first_name,last_name,full_name,email').in('id',ids);
    (profs||[]).forEach(p=>profMap[p.id]=p);
  }
  renderApps();
  show(apps.length?'':'No applications.');
}
function renderApps(){
  const q=(searchEl.value||'').toLowerCase();
  listEl.innerHTML='';
  apps.filter(a=>{
    if(!q)return true;
    const p=profMap[a.user_id]||{};
    return fullName(p).toLowerCase().includes(q)
      || (p.email||'').toLowerCase().includes(q)
      || (a.identity_number||'').toLowerCase().includes(q);
  }).forEach(a=>{
    const p=profMap[a.user_id]||{};
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div class="row">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||''}</div>
          <div><strong>ID#:</strong> ${a.identity_number||'-'}</div>
          <div class="muted">Status: ${pill(a.status)}</div>
          <div class="muted">Submitted: ${new Date(a.created_at).toLocaleString()}</div>
        </div>
        <div><button class="btn" onclick="viewDiploma('${a.diploma_path||''}')">View diploma</button></div>
        <div><button class="btn" ${a.status==='approved'?'disabled':''} onclick="approve('${a.id}')">Approve</button></div>
        <div><button class="btn" ${a.status==='rejected'?'disabled':''} onclick="reject('${a.id}')">Reject</button></div>
      </div>`;
    listEl.appendChild(div);
  });
}
async function viewDiploma(path){
  if(!path)return alert('No file path.');
  const { data, error } = await supa.storage.from(BUCKET).createSignedUrl(path,300);
  if(error)return alert(error.message);
  window.location.assign(data.signedUrl);
}
async function approve(id){
  await supa.from('vet_applications').update({status:'approved'}).eq('id',id);
  await loadApps();
}
async function reject(id){
  await supa.from('vet_applications').update({status:'rejected'}).eq('id',id);
  await loadApps();
}

/* ===== Per-product Approvals ===== */
let vpaRows=[], vpaProfiles={}, vpaProducts={};
function vshow(t){ vpaMsg.textContent=t||''; }

async function loadProductApprovals(){
  vshow('Loading product approvals…');
  const { data, error } = await supa
    .from('vet_product_approvals')
    .select('id,user_id,product_sku,status,created_at')
    .order('created_at',{ascending:true});
  diag('vet_product_approvals select',{count:data?.length||0,error:error?.message||null},!!error);
  if(error){ vshow(error.message);return; }
  vpaRows=data||[];

  const uids=[...new Set(vpaRows.map(r=>r.user_id))];
  const skus=[...new Set(vpaRows.map(r=>r.product_sku))];
  if(uids.length){
    const { data: profs } = await supa.from('profiles')
      .select('id,first_name,last_name,full_name,email').in('id',uids);
    vpaProfiles={}; (profs||[]).forEach(p=>vpaProfiles[p.id]=p);
  }
  if(skus.length){
    const { data: prods } = await supa.from('products').select('sku,name').in('sku',skus);
    vpaProducts={}; (prods||[]).forEach(p=>vpaProducts[p.sku]=p.name);
  }
  renderVPA();
  vshow(vpaRows.length?'':'No per-product requests.');
}
function renderVPA(){
  const q=(vpaSearch.value||'').toLowerCase();
  vpaList.innerHTML='';
  vpaRows.filter(r=>{
    if(!q)return true;
    const p=vpaProfiles[r.user_id]||{};
    const prod=vpaProducts[r.product_sku]||r.product_sku;
    return fullName(p).toLowerCase().includes(q)
      || (p.email||'').toLowerCase().includes(q)
      || prod.toLowerCase().includes(q);
  }).forEach(r=>{
    const p=vpaProfiles[r.user_id]||{};
    const prod=vpaProducts[r.product_sku]||r.product_sku;
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div style="display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:10px;align-items:center">
        <div>
          <div style="font-weight:600">${fullName(p)}</div>
          <div class="muted">${p.email||''}</div>
        </div>
        <div>${prod} <span class="muted">(${r.product_sku})</span></div>
        <div>${pill(r.status)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn small" onclick="approveSku('${r.id}')">Approve</button>
          <button class="btn small" onclick="rejectSku('${r.id}')">Reject</button>
        </div>
      </div>`;
    vpaList.appendChild(div);
  });
}
async function approveSku(id){
  await supa.from('vet_product_approvals').update({status:'approved'}).eq('id',id);
  await loadProductApprovals();
}
async function rejectSku(id){
  await supa.from('vet_product_approvals').update({status:'rejected'}).eq('id',id);
  await loadProductApprovals();
}

/* ===== Boot ===== */
document.addEventListener('DOMContentLoaded', async ()=>{
  const ok=await checkAdmin();
  if(ok){ await loadApps(); await loadProductApprovals(); }
  searchEl.addEventListener('input',renderApps);
  vpaSearch.addEventListener('input',renderVPA);
});
</script>
</body>
</html>
