<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | My orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:18px; }
    html,body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,system-ui;line-height:1.6}
    .wrap{max-width:1000px;margin:0 auto;padding:18px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:18px;padding:16px}
    .row{display:grid;grid-template-columns:1.3fr .8fr .7fr .9fr .7fr;gap:12px;align-items:center}
    .head{font-weight:600;color:#cfe0ff}
    .muted{color:var(--muted)}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.06);color:var(--text);text-decoration:none;display:inline-block}
    a{color:inherit}
    .empty{padding:18px;border:1px dashed rgba(141,158,199,.3);border-radius:14px;text-align:center}
    .err{color:#ffd2d2}
    @media(max-width:840px){ .row{grid-template-columns:1fr 1fr;gap:8px} .head{display:none} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>My orders</h1>
    <div id="box" class="card">Loading…</div>
    <p style="margin-top:14px"><a class="btn" href="Products.html">← Continue shopping</a></p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supa = supabase.createClient(
      "https://qdepgviimbcdlozjpbhm.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0"
    );
    const box = document.getElementById('box');
    const fmt = (dt)=>{ try{ return new Date(dt).toLocaleString(); }catch{ return dt||'-'; } };

    async function load(){
      try{
        const { data:{ user }, error:authErr } = await supa.auth.getUser();
        if (authErr) { box.innerHTML = `<div class="err">${authErr.message}</div>`; return; }
        if (!user) {
          const backTo = location.pathname + location.search;
          location.href = 'login.html?redirect=' + encodeURIComponent(backTo);
          return;
        }

        // Explicitly filter by user_id to avoid any RLS surprises
        const { data: orders, error } = await supa
          .from('orders')
          .select('id,status,created_at,updated_at,delivery_method,payment_method')
          .eq('user_id', user.id)
          .order('created_at', { ascending:false });

        if (error) { box.innerHTML = `<div class="err">${error.message}</div>`; return; }
        if (!orders || orders.length === 0) {
          box.innerHTML = `<div class="empty">You have no orders yet.</div>`;
          return;
        }

        // Count items per order
        const ids = orders.map(o=>o.id);
        const { data: items, error:itemsErr } = await supa
          .from('order_items')
          .select('order_id,quantity')
          .in('order_id', ids);
        if (itemsErr) { box.innerHTML = `<div class="err">${itemsErr.message}</div>`; return; }

        const countMap = {};
        (items||[]).forEach(it=>{
          countMap[it.order_id] = (countMap[it.order_id]||0) + Number(it.quantity||0);
        });

        const rows = [
          `<div class="row head"><div>Order</div><div>Status</div><div>Items</div><div>Updated</div><div>Action</div></div>`,
          ...orders.map(o=>{
            const n = countMap[o.id] || 0;
            const idShort = String(o.id).slice(0,8);
            return `<div class="row">
              <div><strong>#${idShort}</strong><div class="muted">${fmt(o.created_at)}</div></div>
              <div>${o.status}</div>
              <div>${n}</div>
              <div>${fmt(o.updated_at)}</div>
              <div><a class="btn" href="order-view.html?order=${encodeURIComponent(o.id)}">Open</a></div>
            </div>`;
          })
        ].join('');
        box.innerHTML = rows;
      }catch(e){
        console.error(e);
        box.innerHTML = `<div class="err">${e.message||'Unexpected error.'}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
