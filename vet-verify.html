<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><title>VetoCos | Vet verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
.wrap{max-width:560px;margin:6vh auto;padding:0 18px}
.card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);padding:18px}
label{display:block;margin:10px 0 6px}
input[type="text"],input[type="file"]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text)}
.btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-weight:600}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.muted{color:#8ea0c8;margin-top:10px}
.success{color:#83f0a5} .error{color:#ffb4b4}
.small{font-size:.92rem}
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="wrap">
  <div class="card">
    <h1>Vet verification</h1>
    <p class="muted small">Provide your identity number and upload a scan of your veterinary diploma or professional card.</p>

    <label for="idnum">Identity number</label>
    <input id="idnum" type="text" placeholder="e.g., 123456789" autocomplete="off"/>

    <label for="file">Diploma / professional card (PDF/JPG/PNG)</label>
    <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg" />

    <button class="btn" id="submit">Submit for review</button>
    <p id="msg" class="muted"></p>
  </div>
</main>

<script>
/* ===== Supabase ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ===== Cart utils (same as checkout; avoids doubling if you pass ?cart= to this page) ===== */
const CART_KEY = 'cart';
const CART_RESTORED_KEY = 'cart_restored_v2';
function readCart(){ try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch { return []; } }
function writeCart(arr){
  const cleaned = (arr||[]).filter(it=>it&&it.sku&&Number(it.qty)>0).map(it=>({ ...it, qty:Number(it.qty)}));
  localStorage.setItem(CART_KEY, JSON.stringify(cleaned));
  return cleaned;
}
function overlayBySku(baseArr,incomingArr){
  const map={}; (baseArr||[]).forEach(it=>{ if(it?.sku) map[it.sku]={...it, qty:Number(it.qty||0)}; });
  (incomingArr||[]).forEach(it=>{ if(it?.sku) map[it.sku]={...map[it.sku], ...it, qty:Number(it.qty||0)}; });
  return Object.values(map).filter(x=>x.qty>0);
}
(function adoptOnce(){
  if (!sessionStorage.getItem(CART_RESTORED_KEY)) {
    const qs = new URLSearchParams(location.search);
    const raw = qs.get('cart');
    if (raw) {
      try {
        const incoming = JSON.parse(decodeURIComponent(raw));
        writeCart(overlayBySku(readCart(), Array.isArray(incoming)?incoming:[]));
      } catch(e){ console.warn('cart restore failed', e); }
      finally {
        qs.delete('cart');
        history.replaceState({}, '', location.pathname + (qs.toString()?('?'+qs.toString()):''));
        sessionStorage.setItem(CART_RESTORED_KEY,'1');
      }
    } else {
      const backup = localStorage.getItem('cart_backup');
      if (backup) {
        try {
          const incoming = JSON.parse(backup);
          writeCart(overlayBySku(readCart(), Array.isArray(incoming)?incoming:[]));
        } catch(e){ console.warn('backup restore failed', e); }
        finally { localStorage.removeItem('cart_backup'); sessionStorage.setItem(CART_RESTORED_KEY,'1'); }
      }
    }
  }
})();

/* ===== Verification submit ===== */
const BUCKET = 'Documents';
const btn = document.getElementById('submit');

btn.onclick = async () => {
  btn.disabled = true;
  setMsg('Checking sign-in…');

  const { data: { user }, error: uErr } = await supa.auth.getUser();
  if (uErr) { setMsg(uErr.message, 'error'); btn.disabled=false; return; }
  if (!user) { location.replace('login.html?redirect=vet-verify.html'); return; }

  const idnum = document.getElementById('idnum').value.trim();
  const f = document.getElementById('file').files[0];
  if(!idnum || !f) { setMsg('Please enter ID number and choose a file','error'); btn.disabled=false; return; }

  if (f.size > 10 * 1024 * 1024) { setMsg('File too large (max 10 MB).','error'); btn.disabled=false; return; }
  const okTypes = ['application/pdf','image/jpeg','image/png'];
  if (f.type && !okTypes.includes(f.type)) { setMsg('Unsupported file type.','error'); btn.disabled=false; return; }

  const cleanName = f.name.replace(/\s+/g,'_').replace(/[^\w.\-]/g,'').slice(-120);
  const path = `${user.id}/${Date.now()}_${cleanName || 'diploma'}`;

  setMsg('Uploading document…');
  const up = await supa.storage.from(BUCKET).upload(path, f, {
    upsert:false,
    contentType: f.type || 'application/octet-stream',
    cacheControl: '3600'
  });
  if(up.error) { setMsg(up.error.message,'error'); btn.disabled=false; return; }

  setMsg('Saving application…');
  const ins = await supa.from('vet_applications').insert({
    user_id: user.id,
    identity_number: idnum,
    diploma_path: up.data.path,
    status: 'pending'
  });
  if(ins.error) { setMsg(ins.error.message,'error'); btn.disabled=false; return; }

  setMsg('Submitted. We will review and approve your account.','success');
  document.getElementById('idnum').disabled = true;
  document.getElementById('file').disabled = true;
};

function setMsg(t,kind=''){ const p=document.getElementById('msg'); p.textContent=t; p.className='muted '+kind; }
</script>
</body>
</html>
