<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><title>VetoCos | Vet verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
.wrap{max-width:560px;margin:6vh auto;padding:0 18px}
.card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--r);padding:18px}
label{display:block;margin:12px 0 6px}
input[type="text"],input[type="file"]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text)}
.btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-weight:600}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.muted{color:var(--muted);margin-top:10px}
.success{color:#83f0a5} .error{color:#ffb4b4}
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="wrap">
  <div class="card">
    <h1>Vet verification</h1>
    <p class="muted">Provide your identity number and upload a scan of your veterinary diploma or professional card.</p>

    <label for="idnum">Identity number</label>
    <input id="idnum" type="text" placeholder="e.g., 123456789" autocomplete="off"/>

    <label for="file">Diploma / professional card (PDF/JPG/PNG)</label>
    <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg" />

    <button class="btn" id="submit">Submit for review</button>
    <p id="msg" class="muted"></p>
  </div>
</main>

<script>
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0"
);

const BUCKET = 'Documents'; // exact case

const btn = document.getElementById('submit');
const msg = (t,kind='') => { const p=document.getElementById('msg'); p.textContent=t; p.className='muted '+kind; };

btn.onclick = async () => {
  btn.disabled = true;
  msg('Checking sign-in…');

  const { data:{ user }, error:uErr } = await supa.auth.getUser();
  if(uErr){ msg(uErr.message,'error'); btn.disabled=false; return; }
  if(!user){ location.replace('login.html?redirect=vet-verify.html'); return; }

  const idnum = document.getElementById('idnum').value.trim();
  const file = document.getElementById('file').files[0];
  if(!idnum || !file){ msg('Please enter ID number and choose a file.','error'); btn.disabled=false; return; }

  if(file.size > 10*1024*1024){ msg('File too large (max 10 MB).','error'); btn.disabled=false; return; }

  const safeName = file.name.replace(/\s+/g,'_').replace(/[^\w.\-]/g,'');
  const path = `${user.id}/${Date.now()}_${safeName}`;

  msg('Uploading document…');
  const up = await supa.storage.from(BUCKET).upload(path, file, { upsert:false });
  if(up.error){ msg(up.error.message,'error'); btn.disabled=false; return; }

  msg('Saving application…');
  const ins = await supa.from('vet_applications').insert({
    user_id: user.id,
    identity_number: idnum,
    diploma_path: up.data.path,
    status: 'pending'
  });
  if(ins.error){ msg(ins.error.message,'error'); btn.disabled=false; return; }

  msg('Submitted. We will review and approve your account.','success');
  document.getElementById('idnum').disabled = true;
  document.getElementById('file').disabled = true;
};
</script>
</body>
</html>
