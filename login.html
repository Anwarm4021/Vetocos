<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VetoCos | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
  .wrap{max-width:460px;margin:6vh auto;padding:0 18px}
  .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);padding:18px}
  h1{margin:.2rem 0 1rem}
  label{font-size:.9rem;color:var(--muted);display:block}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text);margin-top:6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);cursor:pointer;font-weight:600}
  .muted{color:var(--muted);font-size:.9rem;margin-top:10px}
  .success{color:#83f0a5}
  .error{color:#ffb4b4}
  #codeBox{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Login</h1>
      <p class="muted">Enter your details. We’ll email you a magic link and, if enabled, a 6-digit code.</p>

      <div class="row">
        <div>
          <label>First name
            <input id="first" autocomplete="given-name" />
          </label>
        </div>
        <div>
          <label>Last name
            <input id="last" autocomplete="family-name" />
          </label>
        </div>
      </div>

      <label style="margin-top:10px">Email
        <input id="email" type="email" autocomplete="email" required />
      </label>

      <button class="btn" id="send">Send login email</button>

      <div id="codeBox" aria-live="polite">
        <label style="margin-top:10px">Enter 6-digit code
          <input id="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" />
        </label>
        <button class="btn" id="verify">Verify & continue</button>
      </div>

      <p id="msg" class="muted" aria-live="polite"></p>
    </div>
  </main>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // ===== Supabase config =====
    const SUPABASE_URL  = "https://qdepgviimbcdlozjpbhm.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ===== Helpers =====
    function show(t, kind = "") {
      const p = document.getElementById("msg");
      p.textContent = t;
      p.className = "muted " + kind;
    }

    // Read redirect target (default: products)
    const q = new URLSearchParams(location.search);
    const redirect = q.get("redirect") || "Products.html";

    // If cart disappeared due to cross-origin auth open, restore from backup
    (function restoreCartIfMissing() {
      try {
        const cart = localStorage.getItem("cart");
        const backup = localStorage.getItem("cart_backup");
        if ((!cart || cart === "[]") && backup) {
          const parsed = JSON.parse(backup);
          if (Array.isArray(parsed) && parsed.length > 0) {
            localStorage.setItem("cart", backup);
          }
        }
      } catch {}
    })();

    // If user already authenticated (e.g., returned via magic link), finish flow
    (async () => {
      const { data } = await supa.auth.getSession();
      if (data?.session?.user) {
        await saveNamesToProfileIfAny(data.session.user.id);
        location.replace(redirect);
      }
    })();

    // Also listen for auth state change (covers hash-processing after magic link click)
    supa.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_IN" && session?.user) {
        await saveNamesToProfileIfAny(session.user.id);
        location.replace(redirect);
      }
    });

    // Write first/last name to profile if we saved them pre-auth
    async function saveNamesToProfileIfAny(userId) {
      const first = localStorage.getItem("pending_first") || null;
      const last  = localStorage.getItem("pending_last")  || null;
      if (first || last) {
        try {
          await supa.from("profiles").update({ first_name:first, last_name:last }).eq("id", userId);
        } catch {}
        localStorage.removeItem("pending_first");
        localStorage.removeItem("pending_last");
      }
    }

    // ===== Send login email (magic link and/or OTP depending on your settings) =====
    document.getElementById("send").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const first = document.getElementById("first").value.trim();
      const last  = document.getElementById("last").value.trim();

      if (!email) return show("Please enter your email.", "error");

      // Store names to write after auth
      localStorage.setItem("pending_first", first);
      localStorage.setItem("pending_last",  last);

      // IMPORTANT: use your canonical domain (match EXACTLY what your site uses)
      const absoluteRedirect = `https://vetocos.com/login.html?redirect=${encodeURIComponent(redirect)}`;

      const { error } = await supa.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: absoluteRedirect
        }
      });

      if (error) return show(error.message, "error");

      show("Email sent. Open the magic link (same browser). If your email contains a 6-digit code, you can enter it below.", "success");
      document.getElementById("codeBox").style.display = "block";
    };

    // ===== Verify 6-digit code (only works if Email OTP is enabled) =====
    document.getElementById("verify").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const token = document.getElementById("otp").value.trim();

      if (!email || token.length !== 6) return show("Enter the 6-digit code from your email.", "error");

      const { data, error } = await supa.auth.verifyOtp({
        email,
        token,
        type: "email"
      });

      if (error) return show(error.message, "error");

      await saveNamesToProfileIfAny(data.user.id);
      location.replace(redirect);
    };
  </script>
</body>
</html>
