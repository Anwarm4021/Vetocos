<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VetoCos | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
  .wrap{max-width:480px;margin:6vh auto;padding:0 18px}
  .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);padding:18px}
  h1{margin:.2rem 0 1rem}
  label{font-size:.9rem;color:var(--muted);display:block}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text);margin-top:6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);cursor:pointer;font-weight:600}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .muted{color:var(--muted);font-size:.9rem;margin-top:10px}
  .success{color:#83f0a5}
  .error{color:#ffb4b4}
  #codeBox{display:none}
  .tiny{font-size:.85rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card" role="form">
      <h1>Login</h1>
      <p class="muted">Enter your details. We’ll email you a magic link and, if enabled, a 6-digit code.</p>

      <div class="row">
        <div>
          <label for="first">First name
            <input id="first" autocomplete="given-name" required />
          </label>
        </div>
        <div>
          <label for="last">Last name
            <input id="last" autocomplete="family-name" required />
          </label>
        </div>
      </div>

      <label for="email" style="margin-top:10px">Email
        <input id="email" type="email" autocomplete="email" required />
      </label>

      <button class="btn" id="send">Send login email</button>

      <div id="codeBox" aria-live="polite">
        <label for="otp" style="margin-top:10px">Enter 6-digit code (if your email shows one)
          <input id="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" />
        </label>
        <button class="btn" id="verify">Verify & continue</button>
      </div>

      <p id="msg" class="muted" aria-live="polite"></p>
      <p class="tiny">Having trouble? Open the magic link in the <strong>same browser</strong> where you started the login.</p>
    </div>
  </main>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // ===== Supabase config =====
    const SUPABASE_URL  = "https://qdepgviimbcdlozjpbhm.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ===== Query params =====
    const qs = new URLSearchParams(location.search);
    // Default redirect to checkout.html if not provided
    const redirect = qs.get("redirect") || "checkout.html";
    // Cart may be passed along (encoded JSON)
    const cartParamFromURL = qs.get("cart");

    // ===== UI helpers =====
    const msgEl = document.getElementById("msg");
    function show(t, kind = "") {
      msgEl.textContent = t || "";
      msgEl.className = "muted " + (kind || "");
    }
    function disable(el, on=true){ if(!el) return; el.disabled = !!on; }

    // ===== Cart safety: keep a backup across auth flow =====
    (function restoreCartIfMissing() {
      try {
        const cart = localStorage.getItem("cart");
        const backup = localStorage.getItem("cart_backup");
        if ((!cart || cart === "[]") && backup) {
          const parsed = JSON.parse(backup);
          if (Array.isArray(parsed)) {
            localStorage.setItem("cart", JSON.stringify(parsed));
          }
        }
        // If a cart came via URL (?cart=...), merge/overlay it once
        if (cartParamFromURL) {
          try {
            const fromURL = JSON.parse(decodeURIComponent(cartParamFromURL));
            const local = JSON.parse(localStorage.getItem("cart") || "[]");
            const merged = overlayCarts(local, Array.isArray(fromURL) ? fromURL : []);
            localStorage.setItem("cart", JSON.stringify(merged));
            // clean the URL (keep redirect only)
            const newQS = new URLSearchParams(location.search);
            newQS.delete("cart");
            history.replaceState({}, "", location.pathname + (newQS.toString() ? "?" + newQS.toString() : ""));
          } catch {}
        }
      } catch {}
    })();

    // Overlay carts: override quantities by sku (no summing → prevents doubling)
    function overlayCarts(baseArr, overrideArr) {
      const base = {};
      (baseArr || []).forEach(it => { if (it?.sku) base[it.sku] = { ...it, qty: Number(it.qty || 0) }; });
      (overrideArr || []).forEach(it => {
        if (!it?.sku) return;
        base[it.sku] = { ...base[it.sku], ...it, qty: Number(it.qty || 0) };
      });
      return Object.values(base).filter(x => Number(x.qty) > 0);
    }

    // ===== Pre-fill email if it came in via intent links
    (function prefill() {
      const email = qs.get("email");
      if (email) document.getElementById("email").value = email;
    })();

    // ===== If already authenticated (returned via magic link), finish flow =====
    (async () => {
      const { data } = await supa.auth.getSession();
      if (data?.session?.user) {
        await saveNamesToProfileIfAny(data.session.user.id);
        goNext();
      }
    })();

    // Also listen for auth state changes (covers magic-link hash processing)
    supa.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_IN" && session?.user) {
        await saveNamesToProfileIfAny(session.user.id);
        goNext();
      }
    });

    function goNext(){
      // Preserve redirect (and re-attach cart if you want to re-pass it)
      location.replace(redirect);
    }

    // ===== Persist name fields after auth =====
    async function saveNamesToProfileIfAny(userId) {
      const first = localStorage.getItem("pending_first") || document.getElementById("first").value.trim();
      const last  = localStorage.getItem("pending_last")  || document.getElementById("last").value.trim();

      if (first || last) {
        try {
          await supa.from("profiles").update({ first_name:first || null, last_name:last || null }).eq("id", userId);
        } catch {}
        localStorage.removeItem("pending_first");
        localStorage.removeItem("pending_last");
      }
    }

    // ===== Send login email (magic link and/or OTP depending on your settings) =====
    const sendBtn = document.getElementById("send");
    sendBtn.onclick = async () => {
      show("");
      const email = document.getElementById("email").value.trim();
      const first = document.getElementById("first").value.trim();
      const last  = document.getElementById("last").value.trim();

      if (!first || !last) return show("Please enter your first and last name.", "error");
      if (!email)          return show("Please enter your email.", "error");

      // Save for later profile update (post-auth)
      localStorage.setItem("pending_first", first);
      localStorage.setItem("pending_last",  last);

      // Build absolute redirect back to THIS login page so Supabase can hand control here,
      // then we forward to the final ?redirect page once signed in.
      const cartNow = localStorage.getItem("cart") || "[]";
      localStorage.setItem("cart_backup", cartNow); // extra safety

      const url = new URL(location.href);
      const absoluteLoginUrl = `${url.origin}${url.pathname}?redirect=${encodeURIComponent(redirect)}`;

      disable(sendBtn, true);
      show("Sending email…");

      const { error } = await supa.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: absoluteLoginUrl
        }
      });

      disable(sendBtn, false);

      if (error) return show(error.message, "error");

      show("Email sent. Open the magic link in this browser. If the email shows a 6-digit code, you can enter it below.", "success");
      document.getElementById("codeBox").style.display = "block";
      // Move focus to OTP for convenience
      setTimeout(() => document.getElementById("otp").focus(), 50);
    };

    // ===== Verify 6-digit code (if Email OTP is enabled) =====
    const verifyBtn = document.getElementById("verify");
    verifyBtn.onclick = async () => {
      show("");
      const email = document.getElementById("email").value.trim();
      const token = document.getElementById("otp").value.trim();

      if (!email) return show("Enter your email again to verify.", "error");
      if (token.length !== 6) return show("Enter the 6-digit code from your email.", "error");

      disable(verifyBtn, true);
      show("Verifying…");

      const { data, error } = await supa.auth.verifyOtp({
        email,
        token,
        type: "email" // one-time passcode from email
      });

      disable(verifyBtn, false);

      if (error) return show(error.message, "error");

      await saveNamesToProfileIfAny(data.user.id);
      goNext();
    };
  </script>
</body>
</html>
