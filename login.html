<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    main{max-width:900px;margin:34px auto;padding:0 18px}
    h1,h2{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    label{display:block;font-size:.9rem;color:var(--muted);margin-top:8px}
    input,select,textarea{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
      background:rgba(255,255,255,.05);color:var(--text)
    }
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:760px){.row{grid-template-columns:1fr}}
    .muted{color:var(--muted)}
    .msg{margin-top:8px}
    .ok{color:#a6f3c4}.alert{color:#ffbdbd}
    .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid rgba(141,158,199,.3)}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="card" id="gate">
    <div id="authMsg" class="muted">Checking session…</div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <a class="btn" href="login.html">Sign in</a>
      <a class="btn" href="index.html">Home</a>
      <button id="logout" class="btn" style="display:none">Logout</button>
    </div>
  </div>

  <div id="content" style="display:none">
    <div class="card">
      <h1>My Account</h1>
      <div class="muted" id="emailBox"></div>
    </div>

    <!-- Profile -->
    <div class="card">
      <h2>Profile</h2>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <img id="avatar" class="avatar" src="images/avatar-placeholder.png" alt="Avatar">
        <div>
          <label>Upload new photo
            <input id="avatarFile" type="file" accept=".jpg,.jpeg,.png"/>
          </label>
          <div id="avatarMsg" class="msg muted"></div>
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <div><label>First name<input id="first" autocomplete="given-name"></label></div>
        <div><label>Last name<input id="last" autocomplete="family-name"></label></div>
      </div>
      <div class="row">
        <div><label>Date of birth<input id="dob" type="date"></label></div>
        <div><label>Email (read-only)<input id="email" disabled></label></div>
      </div>
      <button id="saveProfile" class="btn" style="margin-top:10px">Save profile</button>
      <div id="profMsg" class="msg muted"></div>
    </div>

    <!-- Change password -->
    <div class="card" id="pwBox">
      <h2>Change password</h2>
      <div class="row">
        <div><label>Current password<input id="oldPw" type="password" autocomplete="current-password"></label></div>
        <div><label>New password<input id="newPw" type="password" autocomplete="new-password" minlength="8"></label></div>
      </div>
      <div class="row">
        <div><label>Confirm new password<input id="newPw2" type="password" autocomplete="new-password" minlength="8"></label></div>
      </div>
      <button id="changePw" class="btn" style="margin-top:10px">Update password</button>
      <div id="pwMsg" class="msg muted"></div>
    </div>

    <!-- Recovery (coming from reset email) -->
    <div class="card" id="recoveryBox" style="display:none">
      <h2>Set a new password</h2>
      <p class="muted">You arrived here from a password reset email. Enter your new password below.</p>
      <div class="row">
        <div><label>New password<input id="recNew" type="password" minlength="8" autocomplete="new-password"></label></div>
        <div><label>Confirm new password<input id="recNew2" type="password" minlength="8" autocomplete="new-password"></label></div>
      </div>
      <button id="recSave" class="btn" style="margin-top:10px">Save new password</button>
      <div id="recMsg" class="msg muted"></div>
    </div>
  </div>
</main>

<script>
  const supa = supabase.createClient(
    "https://qdepgviimbcdlozjpbhm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
    { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
  );

  const AVATAR_BUCKET = "avatars"; // Change if you use a different bucket name

  const gate = document.getElementById('gate');
  const content = document.getElementById('content');
  const authMsg = document.getElementById('authMsg');
  const logoutBtn = document.getElementById('logout');

  const emailBox = document.getElementById('emailBox');
  const avatar = document.getElementById('avatar');
  const avatarFile = document.getElementById('avatarFile');
  const avatarMsg = document.getElementById('avatarMsg');
  const first = document.getElementById('first');
  const last  = document.getElementById('last');
  const dob   = document.getElementById('dob');
  const email = document.getElementById('email');
  const saveProfile = document.getElementById('saveProfile');
  const profMsg = document.getElementById('profMsg');

  const oldPw = document.getElementById('oldPw');
  const newPw = document.getElementById('newPw');
  const newPw2= document.getElementById('newPw2');
  const changePw = document.getElementById('changePw');
  const pwMsg = document.getElementById('pwMsg');

  const recBox = document.getElementById('recoveryBox');
  const recNew = document.getElementById('recNew');
  const recNew2= document.getElementById('recNew2');
  const recSave= document.getElementById('recSave');
  const recMsg = document.getElementById('recMsg');

  function setTxt(el, t, cls='muted'){ el.textContent=t; el.className='msg '+cls; }
  function filePublicUrl(bucket, path){
    return `https://qdepgviimbcdlozjpbhm.supabase.co/storage/v1/object/public/${bucket}/${encodeURI(String(path||'').replace(new RegExp('^'+bucket+'/'),''))}`;
  }

  // Exchange PKCE if returned from magic/recovery
  (async () => {
    try {
      if (location.search.includes('code=') || location.hash.includes('access_token')) {
        await supa.auth.exchangeCodeForSession(location.href);
        const clean = new URL(location.href);
        ['code','type','access_token','refresh_token','expires_in','token_type'].forEach(k=>clean.searchParams.delete(k));
        history.replaceState({}, '', clean.toString());
      }
    } catch (e) {
      // non-fatal
    }
  })();

  // Detect session + optional recovery state
  async function boot(){
    const { data:{ session } } = await supa.auth.getSession();
    if (!session?.user){
      authMsg.textContent = 'Not signed in.';
      logoutBtn.style.display = 'none';
      gate.style.display = 'block';
      content.style.display = 'none';
      return;
    }
    logoutBtn.style.display = 'inline-block';
    authMsg.textContent = `Signed in as ${session.user.email}`;
    emailBox.textContent = session.user.email;
    email.value = session.user.email;

    // Load profile (if you have a profiles table)
    try{
      const { data: prof } = await supa.from('profiles').select('first_name,last_name,dob,avatar_url').eq('id', session.user.id).maybeSingle();
      if (prof){
        first.value = prof.first_name || '';
        last.value  = prof.last_name || '';
        if (prof.dob) dob.value = String(prof.dob).substring(0,10);
        if (prof.avatar_url) avatar.src = prof.avatar_url.startsWith('http') ? prof.avatar_url : filePublicUrl(AVATAR_BUCKET, prof.avatar_url);
      } else {
        // seed from user_metadata if present
        const md = session.user.user_metadata || {};
        first.value = md.first_name || '';
        last.value  = md.last_name  || '';
        if (md.dob) dob.value = String(md.dob).substring(0,10);
      }
    }catch{}

    gate.style.display = 'none';
    content.style.display = 'block';

    // If user came from reset email (we sent redirect to account.html#recovery=1)
    if (location.hash.includes('recovery=1') || new URLSearchParams(location.search).get('type')==='recovery'){
      recBox.style.display = 'block';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  }

  logoutBtn.onclick = async ()=>{ try{ await supa.auth.signOut(); }catch{} location.href='index.html'; };

  // Save profile
  saveProfile.onclick = async ()=>{
    profMsg.textContent = 'Saving…';
    try{
      const { data:{ user } } = await supa.auth.getUser();
      if (!user) throw new Error('Not signed in');

      // upsert profiles row
      const payload = {
        id: user.id,
        first_name: first.value.trim() || null,
        last_name:  last.value.trim() || null,
        dob:        dob.value || null
      };
      const { error } = await supa.from('profiles').upsert(payload, { onConflict:'id' });
      if (error) throw error;
      setTxt(profMsg,'Saved.','ok');
    }catch(e){
      setTxt(profMsg,e.message||String(e),'alert');
    }
  };

  // Upload avatar
  avatarFile.onchange = async ()=>{
    avatarMsg.textContent = '';
    const f = avatarFile.files[0]; if(!f) return;
    if (!['image/jpeg','image/png'].includes(f.type)){ setTxt(avatarMsg,'Image must be JPG/PNG','alert'); avatarFile.value=''; return; }
    try{
      const { data:{ user } } = await supa.auth.getUser();
      if (!user) throw new Error('Not signed in');
      const safeName = f.name.replace(/\s+/g,'_').replace(/[^\w.\-]/g,'');
      const path = `${user.id}/${Date.now()}_${safeName}`;
      const up = await supa.storage.from(AVATAR_BUCKET).upload(path, f, { upsert:false, cacheControl:'3600', contentType:f.type });
      if (up.error) throw up.error;
      const publicPath = up.data.path;
      await supa.from('profiles').update({ avatar_url: publicPath }).eq('id', user.id);
      avatar.src = filePublicUrl(AVATAR_BUCKET, publicPath);
      setTxt(avatarMsg,'Photo updated.','ok');
      avatarFile.value='';
    }catch(e){
      setTxt(avatarMsg,e.message||String(e),'alert');
    }
  };

  // Change password (verify old password first)
  changePw.onclick = async ()=>{
    pwMsg.textContent = 'Checking…';
    try{
      if (!oldPw.value){ throw new Error('Enter your current password.'); }
      if (!newPw.value || newPw.value.length<8){ throw new Error('New password must be at least 8 characters.'); }
      if (newPw.value !== newPw2.value){ throw new Error('New passwords do not match.'); }

      const { data:{ user } } = await supa.auth.getUser();
      if (!user) throw new Error('Not signed in');

      // verify current PW by signing in (does not change current session)
      const em = user.email;
      const res = await supa.auth.signInWithPassword({ email: em, password: oldPw.value });
      if (res.error) throw new Error('Current password is incorrect.');

      // update to new password
      const { error } = await supa.auth.updateUser({ password: newPw.value });
      if (error) throw error;

      setTxt(pwMsg,'Password updated.','ok');
      oldPw.value = newPw.value = newPw2.value = '';
    }catch(e){
      setTxt(pwMsg,e.message||String(e),'alert');
    }
  };

  // Password recovery completion
  recSave.onclick = async ()=>{
    recMsg.textContent = 'Saving…';
    try{
      if (!recNew.value || recNew.value.length<8) throw new Error('Password must be at least 8 characters.');
      if (recNew.value !== recNew2.value) throw new Error('Passwords do not match.');
      const { error } = await supa.auth.updateUser({ password: recNew.value });
      if (error) throw error;
      setTxt(recMsg,'Your password has been reset.','ok');
      recNew.value = recNew2.value = '';
      // hide recovery UI
      recBox.style.display = 'none';
      history.replaceState({}, '', location.pathname); // remove hash
    }catch(e){
      setTxt(recMsg,e.message||String(e),'alert');
    }
  };

  document.addEventListener('DOMContentLoaded', boot);
  supa.auth.onAuthStateChange((_event,_session)=>{ boot(); });
</script>
</body>
</html>
