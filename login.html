<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--brand:#6dd5ff;--brand2:#83f0a5;--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
    a{color:var(--brand);text-decoration:none}
    main{max-width:720px;margin:7vh auto;padding:0 18px}
    .box{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--radius);padding:18px}
    h1{margin:.3rem 0 1rem}
    label{display:block;font-size:.95rem;color:var(--muted);margin-top:10px}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.28);background:rgba(255,255,255,.03);color:var(--text);margin-top:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn{margin-top:14px;display:inline-block;padding:12px 18px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:#f6f7fb;font-weight:600;cursor:pointer}
    .muted{color:var(--muted)}
    .msg{margin-top:10px;font-size:.95rem}
    .success{color:#83f0a5}.error{color:#ffb4b4}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700}
    .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  </style>
</head>
<body>
<main>
  <div class="box">
    <header>
      <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none"><span class="logo"></span> VetoCos</a></div>
      <div><a href="signup.html">New here? Create an account</a></div>
    </header>

    <h1>Sign in</h1>
    <p class="muted">Use your email and password. If you just confirmed your email, you can sign in now.</p>

    <form id="form">
      <label for="email">Email
        <input id="email" type="email" required autocomplete="email">
      </label>
      <label for="pw">Password
        <input id="pw" type="password" required autocomplete="current-password">
      </label>
      <button class="btn" type="submit" id="submit">Sign in</button>
      <div id="msg" class="msg" aria-live="polite"></div>
    </form>

    <p class="muted" style="margin-top:14px">Having trouble? Ensure you confirmed your email from the signup message.</p>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const supa = supabase.createClient(
    "https://qdepgviimbcdlozjpbhm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
    { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
  );

  const form   = document.getElementById('form');
  const email  = document.getElementById('email');
  const pw     = document.getElementById('pw');
  const msg    = document.getElementById('msg');
  const submit = document.getElementById('submit');

  function show(t, kind=""){ msg.textContent=t||""; msg.className="msg "+kind; }

  // If redirected after confirmation, show a friendly flag
  const qs = new URLSearchParams(location.search);
  if (qs.get('confirmed') === '1'){
    show("Email confirmed. You can sign in now.", "success");
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    show("");
    submit.disabled = true; show("Signing in…");
    const { data, error } = await supa.auth.signInWithPassword({
      email: email.value.trim().toLowerCase(),
      password: pw.value
    });
    submit.disabled = false;

    if (error){
      return show(error.message, "error");
    }

    // If we saved pending profile at signup, upsert it to "profiles" now
    const key = "pending_profile_"+email.value.trim().toLowerCase();
    try{
      const raw = localStorage.getItem(key);
      if (raw){
        const p = JSON.parse(raw);
        await supa.from('profiles').upsert({
          id: data.user.id,
          email: p.email || data.user.email,
          first_name: p.first_name || null,
          last_name: p.last_name || null,
          dob: p.dob || null,
          can_purchase: false  // default; you will flip this after vet+admin verification
        }, { onConflict: 'id' });
        localStorage.removeItem(key);
      } else {
        // If nothing pending, still ensure a row exists
        await supa.from('profiles').upsert({
          id: data.user.id,
          email: data.user.email
        }, { onConflict: 'id' });
      }
    } catch(e){ console.warn("profiles upsert:", e); }

    // Optional redirect support ?redirect=URL
    const to = qs.get('redirect');
    if (to){ location.href = to; }
    else { location.href = 'index.html'; }
  });
</script>
</body>
</html>
