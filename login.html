<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    main{max-width:520px;margin:8vh auto;padding:0 18px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:18px}
    h1{margin:0 0 10px}
    label{display:block;font-size:.92rem;color:var(--muted);margin:10px 0 6px}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:#fff}
    .btn{margin-top:12px;padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:#fff;font-weight:600;cursor:pointer}
    .muted{color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .sep{height:1px;background:rgba(141,158,199,.18);margin:12px 0}
    .alert{padding:10px;border:1px solid rgba(255,120,120,.35);border-radius:10px;background:rgba(255,120,120,.12);color:#ffbdbd;margin-top:10px}
    .ok{border:1px solid rgba(131,240,165,.35);background:rgba(131,240,165,.12);color:#a6f3c4}
    a{color:#6dd5ff;text-decoration:none}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p id="kicker" class="muted">Enter your email to continue.</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email"/>

    <div id="pwWrap">
      <label>Password <span class="muted">(leave empty to receive a magic link)</span></label>
      <input id="password" type="password" placeholder="Optional"/>
    </div>

    <button id="continue" class="btn">Continue</button>
    <div id="msg" class="muted" style="margin-top:8px"></div>

    <div id="notAdminBox" class="alert" style="display:none;margin-top:14px"></div>

    <div class="sep"></div>
    <div class="row">
      <button id="logout" class="btn" style="display:none">Switch account</button>
      <a id="goHome" href="index.html">Back to Home</a>
    </div>
  </div>
</main>

<script>
/* ===== Supabase ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ===== Config ===== */
const ADMIN_EMAILS = ["anwar.moumenjamai19@gmail.com"]; // lower-case

/* ===== DOM ===== */
const titleEl = document.getElementById('title');
const kicker  = document.getElementById('kicker');
const email   = document.getElementById('email');
const password= document.getElementById('password');
const continueBtn = document.getElementById('continue');
const msgEl   = document.getElementById('msg');
const notAdminBox = document.getElementById('notAdminBox');
const logoutBtn = document.getElementById('logout');

/* ===== Helpers ===== */
const params = new URLSearchParams(location.search);
const wantAdmin = params.get('admin') === '1';   // admin-intent flag
const fallbackRedirect = params.get('redirect') || (wantAdmin ? 'admin.html' : 'index.html');

function setMsg(t, kind=''){ msgEl.textContent=t; msgEl.className = kind ? kind : 'muted'; }
function lc(s){ return (s||'').toLowerCase(); }

async function isAdminUser(uid, em){
  // Fast path: email allowlist (lower-case)
  if (ADMIN_EMAILS.includes(lc(em))) return true;
  // Check profile flag
  try {
    const { data } = await supa.from('profiles').select('is_admin').eq('id', uid).maybeSingle();
    return !!data?.is_admin;
  } catch { return false; }
}

async function redirectAfterLogin(){
  const { data:{ session } } = await supa.auth.getSession();
  if (!session?.user) return;

  const uid = session.user.id;
  const em  = lc(session.user.email || '');

  if (wantAdmin){
    const ok = await isAdminUser(uid, em);
    if (ok){
      location.replace('admin.html');
      return;
    } else {
      // Authenticated but not admin → show message, keep them here
      notAdminBox.style.display = 'block';
      notAdminBox.innerHTML = `
        <div><strong>This account isn’t an admin.</strong></div>
        <div style="margin-top:6px">You signed in as <code>${em || '(no email)'}</code> but this user isn’t allowed to access the admin dashboard.</div>
        <div style="margin-top:8px">You can <a href="#" id="swap">switch to your admin account</a>.</div>
      `;
      document.getElementById('swap').onclick = async (e)=>{ e.preventDefault(); await supa.auth.signOut(); location.reload(); };
      logoutBtn.style.display = 'inline-block';
      return;
    }
  }

  // Non-admin flow → use redirect param or home
  location.replace(fallbackRedirect);
}

/* ===== UI text for admin mode ===== */
if (wantAdmin){
  titleEl.textContent = 'Admin sign in';
  kicker.textContent  = 'Sign in with your admin email to open the dashboard.';
}

/* ===== Button actions ===== */
continueBtn.onclick = async ()=>{
  setMsg('Signing in…');
  notAdminBox.style.display = 'none';

  const em = lc(email.value?.trim());
  const pw = password.value;

  if (!em){ setMsg('Enter your email.', 'alert'); return; }

  try{
    if (pw){
      const { error } = await supa.auth.signInWithPassword({ email: em, password: pw });
      if (error) throw error;
    } else {
      // Magic link
      const redirectTo = new URL(location.origin + location.pathname);
      // After magic link completes in same origin, Supabase restores session, then we'll redirectAfterLogin
      const { error } = await supa.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + '/login.html?admin='+(wantAdmin?'1':'0')+'&redirect='+encodeURIComponent(fallbackRedirect) } });
      if (error) throw error;
      setMsg('Check your email for the sign-in link.', 'ok');
      return;
    }
    // For password flow, immediately redirect
    await redirectAfterLogin();
  }catch(err){
    setMsg(err.message || String(err), 'alert');
  }
};

logoutBtn.onclick = async ()=>{ await supa.auth.signOut(); location.reload(); };

/* ===== On load: if already signed in, route appropriately ===== */
document.addEventListener('DOMContentLoaded', redirectAfterLogin);

// Also react when session changes (e.g., returning from magic link)
supa.auth.onAuthStateChange((_event, _session)=>{ redirectAfterLogin(); });
</script>
</body>
</html>
