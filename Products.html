<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Produits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Catalogue produits VetoCos" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
    main{max-width:1120px;margin:40px auto;padding:0 18px}
    h1{margin:0 0 12px}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:14px}
    .muted{color:var(--muted)}
    .search{width:320px;max-width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    .prod{display:grid;grid-template-columns:120px 1fr;gap:12px}
    .prod img{width:120px;height:96px;object-fit:cover;border-radius:10px;border:1px solid rgba(141,158,199,.18)}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25);font-size:.9rem}
    .ok{background:rgba(131,240,165,.12)}
    a{color:#6dd5ff;text-decoration:none}
    .mini{font-size:.9rem}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="row">
      <h1>Produits</h1>
      <input id="q" class="search" placeholder="Rechercher par nom ou SKU" />
    </div>
    <div class="row" style="margin:6px 0 10px">
      <div id="gate" class="muted mini">Vous n’êtes pas connecté. Vous pouvez parcourir, mais l’ajout au panier est réservé aux vétérinaires approuvés.</div>
      <div class="row" style="gap:8px">
        <a class="btn" href="login.html?redirect=Products.html">Se connecter</a>
        <a class="btn" href="vet-verify.html">Vérification vétérinaire</a>
        <a class="btn" href="cart.html">Panier</a>
      </div>
    </div>
    <div id="list" class="grid"></div>
  </main>

<script>
  const supa = supabase.createClient(
    "https://qdepgviimbcdlozjpbhm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
    { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
  );

  const qEl = document.getElementById('q');
  const list = document.getElementById('list');
  const gate = document.getElementById('gate');

  /* Cart (local) */
  function readCart(){ try{ return JSON.parse(localStorage.getItem('cart')||'[]'); }catch{ return []; } }
  function writeCart(items){ localStorage.setItem('cart', JSON.stringify(items)); }
  function addToCart(sku, name){
    const items = readCart();
    const i = items.findIndex(x=>x.sku===sku);
    if(i>-1) items[i].qty = Number(items[i].qty||0)+1; else items.push({ sku, name: name||sku, qty:1 });
    writeCart(items);
  }
  function imgUrl(path){
    return path ? `https://qdepgviimbcdlozjpbhm.supabase.co/storage/v1/object/public/ProductFiles/${encodeURI(path.replace(/^ProductFiles\//,''))}` : '';
  }

  let PRODUCTS=[], PROFILE=null, USER=null;
  function searchable(p){ return `${(p.name||'')} ${(p.sku||'')}`.toLowerCase(); }

  function render(){
    const q=(qEl.value||'').toLowerCase();
    const allowAdd = !!(PROFILE && PROFILE.can_purchase);
    gate.textContent = allowAdd
      ? `Connecté${PROFILE.first_name||PROFILE.last_name?` : ${[PROFILE.first_name,PROFILE.last_name].filter(Boolean).join(' ')}`:''} · ✅ achat autorisé`
      : (USER ? 'Connecté, en attente d’approbation vétérinaire. Vous pouvez demander la vérification.' :
                'Vous n’êtes pas connecté. Vous pouvez parcourir, mais l’ajout au panier est réservé aux vétérinaires approuvés.');

    list.innerHTML = PRODUCTS.filter(p=>!q || searchable(p).includes(q)).map(p=>{
      const ok = p.available && Number(p.stock_qty||0)>0;
      const badge = ok ? '<span class="pill ok">Disponible</span>' : '<span class="pill">Indisponible</span>';
      const img = imgUrl(p.image_path);
      const addBtn = (allowAdd && ok)
        ? `<button class="btn" data-action="add" data-sku="${p.sku}" data-name="${p.name||p.sku}">Ajouter au panier</button>`
        : `<button class="btn" disabled>Ajouter au panier</button>`;
      return `<div class="card">
        <div class="prod">
          ${img?`<img src="${img}" alt="${p.name}">`:'<div style="width:120px;height:96px;border:1px solid rgba(141,158,199,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#789">—</div>'}
          <div>
            <div style="font-weight:600">${p.name||p.sku}</div>
            <div class="muted mini">${p.sku}</div>
            <div class="muted mini" style="margin-top:6px">${p.description||''}</div>
            <div style="margin:8px 0">${badge}</div>
            <div class="row" style="gap:8px;justify-content:flex-start">
              ${addBtn}
              ${p.pdf_path ? `<a class="btn" href="${imgUrl(p.pdf_path)}" target="_blank" rel="noopener">Fiche PDF</a>`:''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  list.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-action="add"]');
    if(!b) return;
    addToCart(b.dataset.sku, b.dataset.name);
    b.textContent = 'Ajouté ✓';
    b.disabled = true;
  });

  qEl.addEventListener('input', render);

  async function boot(){
    const { data:{ user } } = await supa.auth.getUser();
    USER = user || null;
    if (USER){
      const { data } = await supa.from('profiles').select('first_name,last_name,can_purchase').eq('id', USER.id).maybeSingle();
      PROFILE = data || { can_purchase:false };
    }
    const { data: prods } = await supa.from('products')
      .select('sku,name,description,stock_qty,available,image_path,pdf_path')
      .order('sort_order', { ascending:true, nullsFirst:false })
      .order('name');
    PRODUCTS = prods || [];
    render();
  }
  document.addEventListener('DOMContentLoaded', boot);
  supa.auth.onAuthStateChange((_evt, session)=>{ USER=session?.user||null; boot(); });
</script>
</body>
</html>
