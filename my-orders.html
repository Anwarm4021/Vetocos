<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:16px}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
    main{max-width:1000px;margin:5vh auto;padding:0 18px}
    h1{margin:0 0 12px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin:0 0 14px}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .muted{color:var(--muted)}
    .search{width:280px;max-width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    .btn{padding:10px 14px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);cursor:pointer;font-weight:600}
    .btn.small{padding:6px 10px;font-size:.9rem}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .table{width:100%;border-collapse:collapse;margin-top:10px}
    .table th,.table td{padding:10px;border-bottom:1px solid rgba(141,158,199,.15);text-align:left;vertical-align:top}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25);font-size:.9rem}
    .ok{background:rgba(131,240,165,.12)}
    .bad{background:rgba(255,180,180,.12)}
    .pend{background:rgba(109,213,255,.12)}
    .warn{background:rgba(255,200,120,.12)}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid rgba(141,158,199,.25);font-size:.85rem}
    a{color:inherit}
  </style>
</head>
<body>
<main>
  <div class="row" style="margin-bottom:8px">
    <h1>My Orders</h1>
    <div class="muted" id="userLine"></div>
  </div>

  <div class="card">
    <div class="row">
      <input id="q" class="search" placeholder="Search by product / SKU / status">
      <div class="row" style="gap:8px">
        <a class="btn small" href="Products.html">Shop products</a>
        <a class="btn small" href="cart.html">View cart</a>
      </div>
    </div>
    <div id="summary" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="card" id="listCard">
    <div id="msg" class="muted">Loading…</div>
    <table class="table" id="tbl" style="display:none">
      <thead>
        <tr>
          <th style="width:40%">Product</th>
          <th>SKU</th>
          <th>Qty</th>
          <th>Status</th>
          <th>Placed</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div style="display:flex;justify-content:center;margin-top:10px">
      <button id="more" class="btn small" style="display:none">Load more</button>
    </div>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* ===== Supabase ===== */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ===== UI refs ===== */
const userLine = document.getElementById('userLine');
const msgEl    = document.getElementById('msg');
const qEl      = document.getElementById('q');
const tbl      = document.getElementById('tbl');
const rowsEl   = document.getElementById('rows');
const moreBtn  = document.getElementById('more');
const summary  = document.getElementById('summary');

/* ===== Cart (for Reorder) ===== */
function readCart(){ try { return JSON.parse(localStorage.getItem('cart')||'[]'); } catch { return []; } }
function writeCart(items){ localStorage.setItem('cart', JSON.stringify(items)); }
function addToCart(sku, name, qty){
  qty = Math.max(1, Number(qty||1));
  const items = readCart();
  const i = items.findIndex(x=>x.sku===sku);
  if(i>-1) items[i].qty += qty; else items.push({ sku, name: name||sku, qty });
  writeCart(items);
}

/* ===== State ===== */
let USER=null, PROFILE=null;
let ORDERS=[];      // full list loaded so far
let PAGE=0, PAGE_SIZE=20;
let PROD_MAP={};    // sku -> {name}

/* ===== Helpers ===== */
function pill(s){
  const cls = s==='approved'?'ok' : s==='rejected'?'bad' : s==='pending'?'pend' : 'warn';
  return `<span class="pill ${cls}">${s||'—'}</span>`;
}
function fmtDate(x){ try{ return new Date(x).toLocaleString(); } catch { return x||''; } }
function sanitize(t){ return (t||'').replace(/[&<>]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

/* ===== Auth & Load ===== */
async function ensureLogin(){
  const { data:{ user } } = await supa.auth.getUser();
  if (!user){ location.replace('login.html?redirect=' + encodeURIComponent('my-orders.html')); throw new Error('redirect'); }
  USER = user;
}
async function loadProfile(){
  const { data } = await supa.from('profiles')
    .select('first_name,last_name,email,can_purchase').eq('id', USER.id).maybeSingle();
  PROFILE = data || { email: USER.email };
  userLine.textContent = `${(PROFILE.first_name||'') + ' ' + (PROFILE.last_name||'')}`.trim() + (PROFILE.email?` · ${PROFILE.email}`:'');
}

async function loadOrdersPage(){
  msgEl.textContent = 'Loading…';
  const { data, error } = await supa
    .from('orders')
    .select('id,product_sku,quantity,status,created_at')
    .eq('user_id', USER.id)
    .order('created_at', { ascending:false })
    .range(PAGE*PAGE_SIZE, PAGE*PAGE_SIZE + PAGE_SIZE - 1);
  if (error){ msgEl.textContent = error.message; return; }
  if (!data || !data.length){
    if (ORDERS.length===0){ msgEl.innerHTML = `No orders yet. <a class="badge" href="Products.html">Start shopping →</a>`; }
    moreBtn.style.display = 'none';
    return;
  }

  ORDERS = ORDERS.concat(data);

  // fetch product names for any new SKUs
  const unknownSkus = [...new Set(data.map(x=>x.product_sku))].filter(sku=>!PROD_MAP[sku]);
  if (unknownSkus.length){
    const { data: prods } = await supa.from('products').select('sku,name').in('sku', unknownSkus);
    (prods||[]).forEach(p=> PROD_MAP[p.sku] = p.name);
  }

  render();
  PAGE += 1;

  // if got a full page, show "load more"
  moreBtn.style.display = data.length === PAGE_SIZE ? 'inline-block' : 'none';
  msgEl.textContent = '';
}

function render(){
  if (!ORDERS.length){ tbl.style.display='none'; return; }
  tbl.style.display='table';
  const q = (qEl.value||'').toLowerCase();

  const filtered = ORDERS.filter(o=>{
    const name = PROD_MAP[o.product_sku] || '';
    return !q ||
      (name.toLowerCase().includes(q)) ||
      (o.product_sku||'').toLowerCase().includes(q) ||
      (o.status||'').toLowerCase().includes(q);
  });

  rowsEl.innerHTML = filtered.map(o=>{
    const name = sanitize(PROD_MAP[o.product_sku] || '');
    const sku  = sanitize(o.product_sku);
    const qty  = Number(o.quantity||0);
    return `<tr>
      <td><strong>${name||sku}</strong></td>
      <td class="muted">${sku}</td>
      <td>${qty}</td>
      <td>${pill(o.status)}</td>
      <td class="muted">${fmtDate(o.created_at)}</td>
      <td>
        <button class="btn small" data-action="reorder" data-sku="${sku}" data-name="${name||sku}" data-qty="${qty}">Reorder</button>
      </td>
    </tr>`;
  }).join('');

  // summary counts
  const counts = ORDERS.reduce((acc,o)=>{ acc[o.status||'pending']=(acc[o.status||'pending']||0)+1; return acc; },{});
  const parts = Object.entries(counts).map(([k,v])=>`${k}: ${v}`);
  summary.textContent = parts.length ? `Orders — ${parts.join(' · ')}` : '';
}

/* ===== Events ===== */
qEl.addEventListener('input', render);
moreBtn.addEventListener('click', loadOrdersPage);
rowsEl.addEventListener('click', (e)=>{
  const b = e.target.closest('button[data-action="reorder"]');
  if(!b) return;
  const sku = b.dataset.sku, name=b.dataset.name, qty=Number(b.dataset.qty||1);
  addToCart(sku, name, qty);
  b.textContent = 'Added to cart ✓';
  b.disabled = true;
});

/* ===== Boot ===== */
document.addEventListener('DOMContentLoaded', async ()=>{
  try{
    await ensureLogin();
    await loadProfile();
    await loadOrdersPage(); // first page
  } catch(err){
    if (String(err.message||err).includes('redirect')) return;
    msgEl.textContent = 'Error: ' + (err.message||String(err));
  }
});
</script>
</body>
</html>
