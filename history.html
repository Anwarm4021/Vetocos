<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px;--accent:#6dd5ff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    main{max-width:1100px;margin:34px auto;padding:0 18px}
    h1,h2{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .btn.small{padding:6px 10px;font-size:.9rem}
    .btn.danger{background:linear-gradient(135deg,rgba(255,120,120,.18),rgba(255,80,80,.16))}
    .muted{color:var(--muted)}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    label{display:block;font-size:.9rem;color:var(--muted)}
    select,input[type="text"],input[type="date"],textarea{padding:8px 10px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    textarea{min-height:70px;resize:vertical}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid rgba(141,158,199,.18);text-align:left;vertical-align:top}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)} .pend{background:rgba(109,213,255,.12)} .bad{background:rgba(255,180,180,.12)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .lang{display:flex;align-items:center;gap:8px}
    .lang select{min-width:140px}
    .mini{font-size:.88rem}
    .hidden{display:none}
    .address{white-space:pre-wrap}
    .subbox{margin-top:8px;padding:8px;border:1px dashed rgba(141,158,199,.25);border-radius:10px}
    .stack{display:flex;flex-direction:column;gap:6px}
    #toast{position:fixed;right:16px;bottom:16px;background:#18203e;border:1px solid rgba(141,158,199,.25);
           border-radius:12px;padding:10px 14px;color:#fff;max-width:60vw;display:none;z-index:9999}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="card toolbar">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h1>Purchase History</h1>
      <a class="btn small" href="admin.html">Back to Admin</a>
    </div>
  </div>

  <!-- Auth -->
  <div class="card" id="authGate">
    <div id="authMsg" class="muted">Checking session…</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button id="loginBtn" class="btn hidden">Login as Admin</button>
      <button id="logoutBtn" class="btn hidden">Logout</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card hidden" id="filtersWrap">
    <div class="row">
      <input id="q" class="search" placeholder="Search name / email / order #">
      <label>Method
        <select id="method">
          <option value="">All</option>
          <option value="collect">Collect</option>
          <option value="delivery">Delivery</option>
        </select>
      </label>
      <label>Status
        <select id="status">
          <option value="">All</option>
          <option value="pending">pending</option>
          <option value="paid">paid</option>
          <option value="shipped">shipped</option>
          <option value="completed">completed</option>
          <option value="cancelled">cancelled</option>
          <option value="delayed">delayed</option>
        </select>
      </label>
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
      <button id="refresh" class="btn small">Refresh</button>
    </div>
  </div>

  <!-- List -->
  <div class="card hidden" id="listWrap">
    <div id="msg" class="muted">Loading…</div>
    <div id="list"></div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ---------- Supabase ---------- */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "sb_publishable_LAWs9kqrkEQibkLYfyNBAA_11pxJSx6",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);
const ADMIN_EMAILS = ["anwar.moumenjamai19@gmail.com","info@vetocos.com"].map(e=>e.toLowerCase());

/* ---------- Toast ---------- */
const toastEl = document.getElementById("toast");
function toast(msg){ toastEl.textContent = msg; toastEl.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.style.display="none",2200); }

/* ---------- Auth ---------- */
const authMsg  = document.getElementById("authMsg");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn= document.getElementById("logoutBtn");
loginBtn.onclick = () => {
  const u = new URL("login.html", location.href);
  u.searchParams.set("admin", "1");
  u.searchParams.set("redirect", "history.html");
  location.href = u.toString();
};
logoutBtn.onclick = async () => { try{ await supa.auth.signOut(); }catch{} location.href='index.html'; };

async function checkAdmin(){
  authMsg.textContent = "Checking session…";
  const { data:{ session } } = await supa.auth.getSession();
  if (!session?.user){ authMsg.textContent = "Not signed in."; loginBtn.classList.remove('hidden'); return false; }
  authMsg.textContent = `Signed in as ${session.user.email}`;
  logoutBtn.classList.remove('hidden');

  const em = String(session.user.email||'').toLowerCase();
  if (ADMIN_EMAILS.includes(em)) return true;

  // fallback DB flag
  const { data: prof } = await supa.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
  if (!prof?.is_admin){ location.replace('index.html'); return false; }
  return true;
}

/* ---------- Filters & Data ---------- */
const qEl = document.getElementById('q');
const methodEl = document.getElementById('method');
const statusEl = document.getElementById('status');
const fromEl = document.getElementById('from');
const toEl = document.getElementById('to');
document.getElementById('refresh').onclick = load;

let ORDERS = [];

/* helpers */
function displayOrderNumber(o){
  return o.order_number || ('ORD-' + String(o.id || '').toUpperCase().slice(0,8));
}
function normalizeMethod(v){
  const s = String(v||'').toLowerCase();
  if (s==='collect' || s==='pickup') return 'collect';
  if (s==='delivery') return 'delivery';
  return s || '';
}
function fmtMethod(v){
  return normalizeMethod(v)==='collect' ? 'Collect' : 'Delivery';
}
function fmtPay(m){
  const s = String(m||'').toLowerCase();
  if (s==='card_on_delivery') return 'Card on delivery';
  if (s==='cod') return 'Cash on delivery';
  return m || '—';
}
function buildAddress(o){
  const rows = [
    o.address_line1,
    o.address_line2,
    [o.city, o.country].filter(Boolean).join(', '),
    o.postal_code
  ].filter(Boolean);
  return rows.length ? rows.join('\n') : '—';
}
function esc(s=''){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function toUuidOrNull(v){
  const s = String(v||'').trim();
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s) ? s : null;
}

/* RPC: safe notification */
async function sendNotificationToUser({ userId, title, body, orderId=null, type='order', extra={} }){
  const order_uuid = toUuidOrNull(orderId);
  const { data, error } = await supa.rpc('notify_user', {
    p_user_id: userId,
    p_title:   title,
    p_body:    body,
    p_order_id: order_uuid,
    p_type:    type,
    p_extra:   extra
  });
  if (error) throw error;
  return data;
}

/* Orders + profiles */
async function load(){
  const msg = document.getElementById('msg');
  msg.textContent = "Loading…";

  const { data: orders, error } = await supa
    .from('orders')
    .select(`
      id,user_id,created_at,status,
      full_name,email,phone_number,
      delivery_method,payment_method,
      country,address_line1,address_line2,city,postal_code,
      delay_until, delay_note
    `)
    .order('created_at', { ascending:false })
    .limit(1000);

  if (error){ msg.textContent = error.message; return; }

  // profiles (optional)
  const userIds = [...new Set((orders||[]).map(o=>o.user_id).filter(Boolean))];
  let profilesById = {};
  if (userIds.length){
    const { data: profs } = await supa
      .from('profiles')
      .select('id,first_name,last_name')
      .in('id', userIds);
    (profs||[]).forEach(p=>{ profilesById[p.id]=p; });
  }

  ORDERS = (orders||[]).map(o=>{
    const prof = profilesById[o.user_id] || null;
    const profName = [prof?.first_name, prof?.last_name].filter(Boolean).join(' ').trim();
    return { ...o, display_name: (o.full_name || profName || '(no name)') };
  });

  msg.textContent = '';
  render();
}

async function fetchItems(orderId){
  const { data, error } = await supa
    .from('order_items')
    .select('product_sku, product_name, quantity, unit_price')
    .eq('order_id', orderId)
    .order('product_sku', { ascending:true });
  if (error) return [];
  return data || [];
}

/* Save order changes + notify */
async function saveOrder(order){
  const btn = document.querySelector(`button[data-save="${order.id}"]`);
  const old = btn ? btn.innerText : '';
  if (btn){ btn.disabled = true; btn.innerText = 'Saving…'; }
  try{
    // collect latest values from row
    const row = document.querySelector(`tr[data-order="${order.id}"]`);
    const newStatus = row.querySelector(`select[data-st="${order.id}"]`)?.value || order.status;
    const delayUntil = row.querySelector(`input[data-du="${order.id}"]`)?.value || null;
    const delayNote  = row.querySelector(`textarea[data-dn="${order.id}"]`)?.value || null;

    // Update DB
    const patch = { status: newStatus, delay_until: delayUntil || null, delay_note: delayNote || null };
    const { error } = await supa.from('orders').update(patch).eq('id', order.id);
    if (error) throw error;

    // Compose notification text
    let title = `Order ${displayOrderNumber(order)} updated`;
    let body  = `Status: ${newStatus}`;
    let extra = { kind: 'status', status: newStatus };

    if (newStatus === 'delayed' || delayUntil || delayNote) {
      title = `Order ${displayOrderNumber(order)} delayed`;
      body = `Your order is delayed${delayUntil ? ' until '+delayUntil : ''}.` + (delayNote ? ` Note: ${delayNote}` : '');
      extra = { kind: 'delay', status: newStatus, delay_until: delayUntil || null, note: delayNote || '' };
    }

    // Notify user (via RPC; RLS-safe)
    await sendNotificationToUser({
      userId: order.user_id,
      title,
      body,
      orderId: order.id,
      type: 'order',
      extra
    });

    toast('Saved');
    await load();
  }catch(e){
    alert(e?.message || String(e));
  }finally{
    if (btn){ btn.disabled=false; btn.innerText = old || 'Save'; }
  }
}

/* Send custom admin note */
async function sendCustomNote(order){
  const ta = document.querySelector(`textarea[data-note="${order.id}"]`);
  const btn = document.querySelector(`button[data-send="${order.id}"]`);
  if (!ta) return;
  const text = (ta.value || '').trim();
  if (!text){ toast('Write a note first.'); return; }
  const old = btn.innerText; btn.disabled = true; btn.innerText = 'Sending…';
  try{
    await sendNotificationToUser({
      userId: order.user_id,
      title: 'Message from VetoCos',
      body: text,
      orderId: order.id,
      type: 'message',
      extra: { source: 'admin' }
    });
    ta.value = '';
    toast('Sent');
  }catch(e){
    alert(e?.message || String(e));
  }finally{
    btn.disabled = false; btn.innerText = old || 'Send';
  }
}

/* Delete order */
async function deleteOrder(orderId){
  if (!confirm('Delete this order and its items? This cannot be undone.')) return;
  const delBtn = document.querySelector(`button[data-del="${orderId}"]`);
  const old = delBtn ? delBtn.innerText : '';
  if (delBtn){ delBtn.disabled = true; delBtn.innerText = 'Deleting…'; }
  try{
    const delItems = await supa.from('order_items').delete().eq('order_id', orderId);
    if (delItems.error) throw delItems.error;
    const delOrder = await supa.from('orders').delete().eq('id', orderId);
    if (delOrder.error) throw delOrder.error;
    ORDERS = ORDERS.filter(o=>o.id!==orderId);
    render();
    toast('Deleted');
  }catch(e){ alert(e?.message || String(e)); }
  finally{ if (delBtn){ delBtn.disabled=false; delBtn.innerText = old || 'Delete'; } }
}

function render(){
  const list = document.getElementById('list');

  const q = (qEl.value||'').toLowerCase().trim();
  const meth = methodEl.value; // 'collect' | 'delivery' | ''
  const st = statusEl.value;
  const from = fromEl.value ? new Date(fromEl.value) : null;
  const to = toEl.value ? new Date(toEl.value) : null;

  const rows = ORDERS.filter(o=>{
    if (meth && normalizeMethod(o.delivery_method)!==meth) return false;
    if (st && o.status!==st) return false;
    const blob = `${displayOrderNumber(o)} ${o.email||''} ${o.display_name||''} ${o.phone_number||''}`.toLowerCase();
    if (q && !blob.includes(q)) return false;
    const d = new Date(o.created_at);
    if (from && d < from) return false;
    if (to){ let td = new Date(to); td.setHours(23,59,59,999); if (d>td) return false; }
    return true;
  });

  if (!rows.length){
    list.innerHTML = `<div class="muted">No orders.</div>`;
    return;
  }

  list.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Created</th>
          <th>Status</th>
          <th>Items</th>
          <th>Total</th>
          <th>Method</th>
          <th>Payment</th>
          <th>Address</th>
          <th style="min-width:220px"></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(o=>{
          const du = o.delay_until ? String(o.delay_until).slice(0,10) : '';
          const dn = o.delay_note || '';
          return `<tr data-order="${o.id}">
            <td><strong>${displayOrderNumber(o)}</strong></td>
            <td>${esc(o.display_name||'(no name)')}</td>
            <td>${esc(o.email||'')}</td>
            <td>${esc(o.phone_number||'')}</td>
            <td class="mini">${new Date(o.created_at).toLocaleString()}</td>
            <td>
              <select data-st="${o.id}">
                <option value="pending" ${o.status==='pending'?'selected':''}>pending</option>
                <option value="paid" ${o.status==='paid'?'selected':''}>paid</option>
                <option value="shipped" ${o.status==='shipped'?'selected':''}>shipped</option>
                <option value="completed" ${o.status==='completed'?'selected':''}>completed</option>
                <option value="cancelled" ${o.status==='cancelled'?'selected':''}>cancelled</option>
                <option value="delayed" ${o.status==='delayed'?'selected':''}>delayed</option>
              </select>

              <div class="subbox stack">
                <div class="row" style="gap:6px;align-items:flex-end">
                  <label>Delay until<br><input type="date" data-du="${o.id}" value="${du}"></label>
                  <div style="flex:1">
                    <label>Delay note<br><textarea data-dn="${o.id}" placeholder="Optional explanation…">${esc(dn)}</textarea></label>
                  </div>
                </div>
              </div>

              <div class="subbox stack">
                <label>Send note to user (optional)<br>
                  <textarea data-note="${o.id}" placeholder="Write a short message…"></textarea>
                </label>
                <button class="btn small" data-send="${o.id}">Send</button>
              </div>
            </td>
            <td>
              <button class="btn small" data-items="toggle">View items</button>
              <div class="mini" data-items-box style="display:none; margin-top:6px">…</div>
            </td>
            <td class="mini" data-total="${o.id}">—</td>
            <td class="mini">${fmtMethod(o.delivery_method)}</td>
            <td class="mini">${fmtPay(o.payment_method)}</td>
            <td class="mini address">${esc(buildAddress(o))}</td>
            <td style="text-align:right;">
              <button class="btn small" data-save="${o.id}">Save</button>
              <button class="btn danger small" data-del="${o.id}">Delete</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // items toggle
  list.querySelectorAll('button[data-items="toggle"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest('tr');
      const box = tr.querySelector('[data-items-box]');
      const totCell = tr.querySelector('[data-total]');
      if (box.getAttribute('data-loaded')==='1'){
        const open = box.style.display!=='none';
        box.style.display = open ? 'none' : 'block';
        btn.innerText = open ? 'View items' : 'Hide items';
        return;
      }
      box.textContent = 'Loading…';
      const orderId = tr.getAttribute('data-order');
      const items = await fetchItems(orderId);
      if (!items.length){ box.textContent = '-'; box.setAttribute('data-loaded','1'); box.style.display='block'; btn.innerText = 'Hide items'; totCell.textContent = '0.00'; return; }
      const total = items.reduce((s,it)=> s + Number(it.quantity||0)*Number(it.unit_price||0), 0);
      totCell.textContent = total.toFixed(2);
      box.innerHTML = `
        <table class="mini" style="width:100%">
          <thead><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
          <tbody>
            ${items.map(it=>`<tr>
              <td>${esc(it.product_sku||'')}</td>
              <td>${esc(it.product_name||'')}</td>
              <td>${Number(it.quantity||0)}</td>
              <td>${(Number(it.unit_price||0)*Number(it.quantity||0)).toFixed(2)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      `;
      box.setAttribute('data-loaded','1');
      box.style.display='block';
      btn.innerText = 'Hide items';
    };
  });

  // save
  list.querySelectorAll('button[data-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-save');
      const order = ORDERS.find(o=>String(o.id)===String(id));
      if (order) await saveOrder(order);
    };
  });

  // delete
  list.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.onclick = ()=> deleteOrder(btn.getAttribute('data-del'));
  });

  // send custom note
  list.querySelectorAll('button[data-send]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-send');
      const order = ORDERS.find(o=>String(o.id)===String(id));
      if (order) sendCustomNote(order);
    };
  });
}

/* ---------- Boot ---------- */
document.addEventListener('DOMContentLoaded', async ()=>{
  const ok = await checkAdmin();
  if (!ok) return;
  document.getElementById('filtersWrap').classList.remove('hidden');
  document.getElementById('listWrap').classList.remove('hidden');

  qEl.addEventListener('input', render);
  methodEl.addEventListener('change', render);
  statusEl.addEventListener('change', render);
  fromEl.addEventListener('change', render);
  toEl.addEventListener('change', render);

  await load();

  // realtime (optional)
  try{
    supa.channel('rt_orders')
      .on('postgres_changes', { event: '*', schema:'public', table:'orders' }, ()=> load())
      .subscribe();
    supa.channel('rt_order_items')
      .on('postgres_changes', { event: '*', schema:'public', table:'order_items' }, ()=> load())
      .subscribe();
  }catch{}
});
</script>
</body>
</html>
