<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Orders History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px;--accent:#6dd5ff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    main{max-width:1200px;margin:34px auto;padding:0 18px}
    h1,h2{margin:0 0 14px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));
         color:var(--text);font-weight:600;cursor:pointer}
    .btn.small{padding:6px 10px;font-size:.9rem}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted)}
    .mini{font-size:.88rem}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    select,input[type="date"]{padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid rgba(141,158,199,.18);text-align:left;vertical-align:top}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)}
    .pend{background:rgba(109,213,255,.12)}
    .bad{background:rgba(255,180,180,.12)}
    #toast{position:fixed;right:16px;bottom:16px;background:#18203e;border:1px solid rgba(141,158,199,.25);
           border-radius:12px;padding:10px 14px;color:#fff;max-width:60vw;display:none;z-index:9999}
    .addr{white-space:pre-wrap}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <h1 style="margin:0">Orders History</h1>
    <div class="row">
      <a class="btn small" href="admin.html">Back to Admin</a>
      <button class="btn small" id="exportBtn" title="Export current view to CSV">Export CSV</button>
    </div>
  </div>

  <!-- Auth -->
  <div class="card" id="authGate">
    <div id="authMsg" class="muted">Checking session…</div>
  </div>

  <!-- Filters -->
  <div class="card hidden" id="filtersWrap">
    <div class="toolbar">
      <h2>Filters</h2>
      <div class="row">
        <input id="q" class="search" placeholder="Search name / email / phone / address / order #">
        <select id="method">
          <option value="">All methods</option>
          <option value="pickup">Pickup</option>
          <option value="delivery">Delivery</option>
        </select>
        <select id="status">
          <option value="">All statuses</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="cancelled">Cancelled</option>
          <option value="shipped">Shipped</option>
          <option value="fulfilled">Fulfilled</option>
        </select>
        <input id="from" type="date" />
        <input id="to" type="date" />
        <button id="refresh" class="btn small">Refresh</button>
      </div>
    </div>
    <div class="mini muted">Tip: the page shows the last 120 days by default. Use the date filters to widen.</div>
  </div>

  <!-- Results -->
  <div class="card hidden" id="listWrap">
    <div class="toolbar" style="margin-bottom:6px">
      <h2>Results</h2>
      <div class="mini muted" id="countMsg"></div>
    </div>
    <div id="rows">Loading…</div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ================= Supabase ================= */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);

/* ================= UI helpers ================= */
const toastEl=document.getElementById('toast');
function toast(m,err=false){ toastEl.textContent=m; toastEl.style.display='block'; toastEl.style.borderColor=err?'rgba(255,120,120,.4)':'rgba(141,158,199,.25)'; clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.style.display='none',2200); }
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

/* ================= Auth ================= */
const authMsg=document.getElementById('authMsg');
const filtersWrap=document.getElementById('filtersWrap');
const listWrap=document.getElementById('listWrap');

const ADMIN_EMAILS=["anwar.moumenjamai19@gmail.com"];

async function checkAdmin(){
  authMsg.textContent = "Checking session…";
  const { data:{ session } } = await supa.auth.getSession();
  if (!session?.user){ authMsg.textContent="Not signed in."; return false; }
  authMsg.textContent = `Signed in as ${session.user.email}`;

  if (ADMIN_EMAILS.includes(String(session.user.email||'').toLowerCase())) return true;
  const { data: prof } = await supa.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
  if (!prof?.is_admin){ location.replace('index.html'); return false; }
  return true;
}

/* ================= Filters ================= */
const qEl=document.getElementById('q');
const methodEl=document.getElementById('method');
const statusEl=document.getElementById('status');
const fromEl=document.getElementById('from');
const toEl=document.getElementById('to');
const refreshBtn=document.getElementById('refresh');
const rowsEl=document.getElementById('rows');
const countMsg=document.getElementById('countMsg');
const exportBtn=document.getElementById('exportBtn');

let ORDERS_CACHE=[];

function defaultDates(){
  const now=new Date();
  const start=new Date(now); start.setDate(start.getDate()-120);
  fromEl.value = start.toISOString().slice(0,10);
  toEl.value   = now.toISOString().slice(0,10);
}

function normalizeMethod(row){
  // We support multiple possible column names
  const m = (row.fulfillment_method || row.delivery_method || row.method || '').toLowerCase();
  if (m==='pickup' || m==='collect' || m==='collection') return 'pickup';
  if (m==='delivery' || m==='home' || m==='ship' || m==='shipping') return 'delivery';
  return m || ''; // unknown/blank
}
function normalizeAddress(row){
  // Support a JSON object or flat text fields
  const j = row.shipping_address || row.address || null;
  if (j && typeof j === 'object'){
    const name = [j.name || j.full_name || ''].filter(Boolean).join(' ');
    const phone = j.phone || j.phone_number || row.phone || '';
    const lines = [
      name ? name : '',
      j.line1 || j.address1 || '',
      j.line2 || j.address2 || '',
      [j.city, j.region || j.state, j.postal_code || j.zip].filter(Boolean).join(' '),
      j.country || ''
    ].filter(Boolean);
    const label = lines.join('\n');
    return { name, phone, label };
  }
  // maybe we have text columns
  const label = row.address_text || row.address || '';
  const phone = row.phone || '';
  return { name:'', phone, label: String(label||'') };
}
function pillStatus(s){
  const st=(s||'').toLowerCase();
  const cls = st==='paid' || st==='fulfilled' || st==='shipped' ? 'ok' : st==='cancelled' ? 'bad' : 'pend';
  return `<span class="pill ${cls}">${escapeHtml(s||'pending')}</span>`;
}

function render(){
  const q=(qEl.value||'').toLowerCase().trim();
  const m=(methodEl.value||'').toLowerCase();
  const st=(statusEl.value||'').toLowerCase();

  const rows = ORDERS_CACHE.filter(r=>{
    if (m && r._method !== m) return false;
    if (st && String(r.status||'').toLowerCase() !== st) return false;
    if (q){
      const blob = [
        r._name || '',
        r._email || '',
        r._phone || '',
        r._addr || '',
        String(r.id||'')
      ].join(' ').toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  countMsg.textContent = `${rows.length} order${rows.length===1?'':'s'}`;
  if (!rows.length){ rowsEl.innerHTML = '<div class="muted">No results.</div>'; return; }

  rowsEl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Order #</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Method</th>
          <th>Status</th>
          <th>Qty / Amount</th>
          <th>Address / Notes</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r=>{
          return `<tr>
            <td><strong>${r.id}</strong></td>
            <td class="mini">${new Date(r.created_at).toLocaleString()}</td>
            <td>
              <div style="font-weight:600">${escapeHtml(r._name || '(no name)')}</div>
              <div class="mini muted">${escapeHtml(r._email || '')}</div>
              ${r._phone?`<div class="mini muted">☎ ${escapeHtml(r._phone)}</div>`:''}
            </td>
            <td>${r._method==='delivery'?'<span class="pill">Delivery</span>':'<span class="pill">Pickup</span>'}</td>
            <td>${pillStatus(r.status)}</td>
            <td class="mini">${Number(r.total_qty||0)} items<br>${r.total_amount!=null?Number(r.total_amount).toFixed(2):'-'}</td>
            <td class="addr mini">
              ${r._addr ? escapeHtml(r._addr) : '<span class="muted">(no address)</span>'}
              ${r.notes ? `<div style="margin-top:6px"><strong>Notes:</strong> ${escapeHtml(r.notes)}</div>`:''}
              ${r.receipt_url ? `<div style="margin-top:6px"><a class="btn small" href="${r.receipt_url}" target="_blank" rel="noopener">Receipt</a></div>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

/* CSV export of current view */
function toCSV(rows){
  const head = ["order_id","created_at","customer_name","customer_email","phone","method","status","total_qty","total_amount","address","notes"];
  const esc = v => {
    const s = String(v==null?'':v);
    if (/[",\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
    return s;
  };
  const body = rows.map(r=>[
    r.id, r.created_at, r._name, r._email, r._phone, r._method, r.status, r.total_qty, r.total_amount, r._addr, r.notes||''
  ].map(esc).join(',')).join('\n');
  return head.join(',') + '\n' + body;
}
function download(filename, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = filename;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 500);
}
exportBtn.onclick = ()=>{
  // apply same filter as render()
  const q=(qEl.value||'').toLowerCase().trim();
  const m=(methodEl.value||'').toLowerCase();
  const st=(statusEl.value||'').toLowerCase();
  const rows = ORDERS_CACHE.filter(r=>{
    if (m && r._method !== m) return false;
    if (st && String(r.status||'').toLowerCase() !== st) return false;
    if (q){
      const blob = [r._name||'', r._email||'', r._phone||'', r._addr||'', String(r.id||'')].join(' ').toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
  download(`orders_history_${new Date().toISOString().slice(0,10)}.csv`, toCSV(rows));
};

/* ================= Data load ================= */
async function loadOrders(){
  rowsEl.textContent = 'Loading…';

  // Build date window (inclusive)
  const from = fromEl.value ? new Date(fromEl.value+'T00:00:00') : null;
  const to   = toEl.value ? new Date(toEl.value+'T23:59:59') : null;

  let q = supa.from('orders').select(`
    id, user_id, created_at, status, total_qty, total_amount, receipt_url, notes,
    fulfillment_method, delivery_method, method, shipping_address, address, address_text, phone,
    profiles:profiles!inner(email,first_name,last_name)
  `).order('created_at', { ascending:false }).limit(2000);

  if (from) q = q.gte('created_at', from.toISOString());
  if (to)   q = q.lte('created_at', to.toISOString());

  const { data, error } = await q;
  if (error){ rowsEl.textContent = error.message; return; }

  ORDERS_CACHE = (data||[]).map(r=>{
    const m = normalizeMethod(r) || 'pickup';
    const addr = normalizeAddress(r);
    const name = [r.profiles?.first_name, r.profiles?.last_name].filter(Boolean).join(' ') || '(no name)';
    return {
      ...r,
      _method: m,
      _name: name,
      _email: r.profiles?.email || '',
      _phone: addr.phone || r.phone || '',
      _addr: addr.label
    };
  });

  render();
}

/* ================= Boot ================= */
document.addEventListener('DOMContentLoaded', async ()=>{
  const ok = await checkAdmin();
  if (!ok) return;

  filtersWrap.classList.remove('hidden');
  listWrap.classList.remove('hidden');
  defaultDates();
  await loadOrders();

  [qEl, methodEl, statusEl, fromEl, toEl].forEach(el=> el.addEventListener('change', ()=> render()));
  document.getElementById('refresh').addEventListener('click', loadOrders);

  // Realtime new orders
  try{
    supa.channel('rt_orders')
      .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, async ()=>{
        toast('Orders updated'); await loadOrders();
      })
      .subscribe();
  }catch{}
});
</script>
</body>
</html>
