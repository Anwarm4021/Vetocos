<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VetoCos | Admin · Purchase History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px;--accent:#6dd5ff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text)}
    main{max-width:1100px;margin:34px auto;padding:0 18px}
    h1{margin:0 0 12px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:14px}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
         background:linear-gradient(135deg,rgba(109,213,255,.15),rgba(131,240,165,.12));color:var(--text);font-weight:600;cursor:pointer}
    .btn.small{padding:6px 10px;font-size:.9rem}
    .muted{color:var(--muted)}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);
            background:rgba(255,255,255,.05);color:var(--text)}
    label{display:block;font-size:.9rem;color:var(--muted)}
    select,input[type="text"],input[type="date"]{padding:10px 12px;border-radius:10px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid rgba(141,158,199,.18);text-align:left;vertical-align:top}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid rgba(141,158,199,.25)}
    .ok{background:rgba(131,240,165,.12)} .pend{background:rgba(109,213,255,.12)} .bad{background:rgba(255,180,180,.12)} .warn{background:rgba(255,200,120,.12)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mini{font-size:.9rem}
    .address{white-space:pre-wrap}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .danger{border-color:rgba(255,120,120,.4);background:linear-gradient(135deg,rgba(255,120,120,.18),rgba(255,120,120,.12))}
    .items{margin-top:8px;border:1px dashed rgba(141,158,199,.25);border-radius:10px;padding:8px}
    .items table{border-collapse:collapse}
    .items th,.items td{border-bottom:1px solid rgba(141,158,199,.15);padding:6px 8px}
    .right{text-align:right}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="card toolbar">
    <div class="row">
      <h1>Purchase History</h1>
      <a class="btn small" href="admin.html">Back to Admin</a>
    </div>
    <div class="row">
      <input id="q" class="search" placeholder="Search name / email / order id">
      <label>Status
        <select id="status">
          <option value="">All</option>
          <option>pending</option>
          <option>approved</option>
          <option>rejected</option>
          <option>paid</option>
          <option>shipped</option>
          <option>completed</option>
          <option>cancelled</option>
        </select>
      </label>
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
      <button id="refresh" class="btn small">Refresh</button>
    </div>
  </div>

  <!-- Auth -->
  <div class="card" id="authGate">
    <div id="authMsg" class="muted">Checking session…</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button id="loginBtn" class="btn hidden">Login as Admin</button>
      <button id="logoutBtn" class="btn hidden">Logout</button>
    </div>
  </div>

  <!-- List -->
  <div class="card hidden" id="listWrap">
    <div id="msg" class="muted">Loading…</div>
    <div id="list"></div>
  </div>
</main>

<script>
/* ---------- Supabase ---------- */
const supa = supabase.createClient(
  "https://qdepgviimbcdlozjpbhm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
  { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
);
const ADMIN_EMAILS = ["anwar.moumenjamai19@gmail.com"];

/* ---------- Auth ---------- */
const authMsg  = document.getElementById("authMsg");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn= document.getElementById("logoutBtn");
loginBtn.onclick = () => {
  const u = new URL("login.html", location.href);
  u.searchParams.set("admin", "1");
  u.searchParams.set("redirect", "history.html");
  location.href = u.toString();
};
logoutBtn.onclick = async () => { try{ await supa.auth.signOut(); }catch{} location.href='index.html'; };

async function checkAdmin(){
  authMsg.textContent = "Checking session…";
  const { data:{ session } } = await supa.auth.getSession();
  if (!session?.user){ authMsg.textContent = "Not signed in."; loginBtn.classList.remove('hidden'); return false; }
  authMsg.textContent = `Signed in as ${session.user.email}`;
  logoutBtn.classList.remove('hidden');

  if (ADMIN_EMAILS.includes(String(session.user.email||'').toLowerCase())) return true;

  // require profiles.is_admin = true otherwise redirect
  const { data: prof } = await supa.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
  if (!prof?.is_admin){ location.replace('index.html'); return false; }
  return true;
}

/* ---------- Filters & Data ---------- */
const qEl = document.getElementById('q');
const statusEl = document.getElementById('status');
const fromEl = document.getElementById('from');
const toEl = document.getElementById('to');
document.getElementById('refresh').onclick = load;

let ORDERS = [];
async function load(){
  const msg = document.getElementById('msg');
  msg.textContent = "Loading…";
  // keep the base columns that exist in your DB; add delivery fields only if you created them
  const { data, error } = await supa
    .from('orders')
    .select(`
      id, user_id, status, created_at,
      delivery_status, delay_until, delay_note, delivery_method, delivery_address,
      profiles:profiles!inner(email, first_name, last_name)
    `)
    .order('created_at', { ascending:false })
    .limit(500);
  if (error){
    // fallback if you don't have delivery columns yet
    const r2 = await supa
      .from('orders')
      .select(`id, user_id, status, created_at, profiles:profiles!inner(email, first_name, last_name)`)
      .order('created_at', { ascending:false })
      .limit(500);
    if (r2.error){ msg.textContent = r2.error.message; return; }
    ORDERS = r2.data || [];
  } else {
    ORDERS = data || [];
  }
  msg.textContent='';
  render();
}

async function fetchItems(orderId){
  // Try order_items with product_name and unit_price first
  let { data, error } = await supa
    .from('order_items')
    .select('product_sku, product_name, quantity, unit_price')
    .eq('order_id', orderId)
    .order('product_sku', { ascending:true });

  if (error){
    // fallback: join products to get name, still show qty; price may not exist
    const r = await supa
      .from('order_items')
      .select('product_sku, quantity, products!inner(name)')
      .eq('order_id', orderId)
      .order('product_sku', { ascending:true });
    if (r.error){ return { items:[], showPrice:false }; }
    const items = (r.data||[]).map(x=>({
      product_sku: x.product_sku,
      product_name: (x.products && x.products.name) || '',
      quantity: x.quantity,
      unit_price: null
    }));
    return { items, showPrice:false };
  }

  // detect if unit_price exists
  const showPrice = (data||[]).some(x=> typeof x.unit_price === 'number' );
  return { items:(data||[]), showPrice };
}

function pill(s){
  const st=(s||'').toLowerCase();
  const cls = st==='completed'?'ok':st==='pending'?'pend':st==='cancelled'?'bad':(st==='shipped'||st==='paid')?'ok':'warn';
  return `<span class="pill ${cls}">${s||'—'}</span>`;
}
function fmtDate(x){ try{ return new Date(x).toLocaleString(); } catch { return x||''; } }
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

function matchesFilters(o){
  const q=(qEl.value||'').toLowerCase().trim();
  const st=(statusEl.value||'').toLowerCase();
  const from = fromEl.value ? new Date(fromEl.value) : null;
  const to   = toEl.value   ? new Date(toEl.value)   : null;
  if (st && (o.status||'').toLowerCase()!==st) return false;

  const tstr = `${o.id} ${(o.profiles?.email||'').toLowerCase()} ${String(o.profiles?.first_name||'')} ${String(o.profiles?.last_name||'')}`.toLowerCase();
  if (q && !tstr.includes(q)) return false;

  const d = new Date(o.created_at);
  if (from && d < from) return false;
  if (to){ let td = new Date(to); td.setHours(23,59,59,999); if (d>td) return false; }
  return true;
}

function render(){
  const list = document.getElementById('list');
  const rows = ORDERS.filter(matchesFilters);
  if (!rows.length){ list.innerHTML = `<div class="muted">No orders.</div>`; return; }

  list.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Email</th>
          <th>Created</th>
          <th>Status</th>
          <th>Delivery</th>
          <th class="right">Actions</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(o=>{
          const name = [o.profiles?.first_name, o.profiles?.last_name].filter(Boolean).join(' ') || '(no name)';
          const deliveryBits = [
            o.delivery_method ? `Method: ${escapeHtml(o.delivery_method)}` : '',
            o.delivery_address ? `Address: ${escapeHtml(o.delivery_address)}` : '',
            o.delivery_status ? `Delivery: ${escapeHtml(o.delivery_status)}` : '',
            o.delay_until ? `Delay until: ${fmtDate(o.delay_until)}` : '',
            o.delay_note ? `Note: ${escapeHtml(o.delay_note)}` : ''
          ].filter(Boolean).join('<br>');
          return `<tr data-id="${o.id}">
            <td><strong>${o.id}</strong><div><button class="btn small" data-items="toggle">View items</button></div>
                <div class="items" data-items-box style="display:none">…</div>
            </td>
            <td>${escapeHtml(name)}</td>
            <td>${escapeHtml(o.profiles?.email||'')}</td>
            <td class="mini">${fmtDate(o.created_at)}</td>
            <td>${pill(o.status)}</td>
            <td class="mini">${deliveryBits || '<span class="muted">—</span>'}</td>
            <td class="right">
              <div class="actions">
                <select data-act="setStatus">
                  <option hidden selected>Set status…</option>
                  <option>pending</option><option>approved</option><option>rejected</option>
                  <option>paid</option><option>shipped</option><option>completed</option><option>cancelled</option>
                </select>
                <button class="btn small" data-act="editDelivery">Edit delivery</button>
                <button class="btn small danger" data-act="delete">Delete</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // bind item toggles
  list.querySelectorAll('button[data-items="toggle"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest('tr');
      const orderId = tr.getAttribute('data-id');
      const box = tr.querySelector('[data-items-box]');
      const open = box.style.display!=='none';
      if (open){ box.style.display='none'; btn.textContent='View items'; return; }
      box.style.display='block'; btn.textContent='Hide items';
      if (box.getAttribute('data-loaded')==='1') return;

      box.textContent = 'Loading items…';
      const { items, showPrice } = await fetchItems(orderId);
      if (!items.length){ box.textContent = '—'; box.setAttribute('data-loaded','1'); return; }

      // totals if price present
      let total=0;
      const rows = items.map(it=>{
        const sub = (showPrice && typeof it.unit_price==='number') ? (Number(it.unit_price||0)*Number(it.quantity||0)) : null;
        if (sub!=null) total += sub;
        return `<tr>
          <td class="mini">${escapeHtml(it.product_sku||'')}</td>
          <td>${escapeHtml(it.product_name||'')}</td>
          <td>${Number(it.quantity||0)}</td>
          ${showPrice?`<td class="right">${Number(it.unit_price||0).toFixed(2)}</td><td class="right">${(sub||0).toFixed(2)}</td>`:''}
        </tr>`;
      }).join('');

      box.innerHTML = `
        <table style="width:100%">
          <thead>
            <tr>
              <th class="mini">SKU</th>
              <th>Item</th>
              <th>Qty</th>
              ${showPrice?'<th class="right">Unit</th><th class="right">Subtotal</th>':''}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          ${showPrice?`<tfoot><tr><td colspan="4" class="right"><strong>Total</strong></td><td class="right"><strong>${total.toFixed(2)}</strong></td></tr></tfoot>`:''}
        </table>
      `;
      box.setAttribute('data-loaded','1');
    };
  });

  // bind actions
  list.querySelectorAll('select[data-act="setStatus"]').forEach(sel=>{
    sel.onchange = async (e)=>{
      const tr = sel.closest('tr'); const id = tr.getAttribute('data-id'); const val = sel.value;
      sel.disabled = true;
      const { error } = await supa.from('orders').update({ status: val }).eq('id', id);
      if (error){ alert(error.message); } else { await load(); }
      sel.disabled = false; sel.value = 'Set status…';
    };
  });

  list.querySelectorAll('button[data-act="editDelivery"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest('tr'); const id = tr.getAttribute('data-id');
      const method = prompt('Delivery method (collect/delivery or custom):', '');
      const address = prompt('Delivery address:', '');
      const dstat = prompt('Delivery status (on_time / delayed / delivered):', '');
      const duntil= prompt('Delay until (YYYY-MM-DD or empty):', '');
      const dnote = prompt('Delay note:', '');
      const patch = {};
      if (method!==null) patch.delivery_method = method || null;
      if (address!==null) patch.delivery_address = address || null;
      if (dstat!==null) patch.delivery_status = dstat || null;
      if (duntil!==null) patch.delay_until = duntil ? new Date(duntil).toISOString() : null;
      if (dnote!==null) patch.delay_note = dnote || null;
      const { error } = await supa.from('orders').update(patch).eq('id', id);
      if (error){ alert(error.message); } else { await load(); }
    };
  });

  list.querySelectorAll('button[data-act="delete"]').forEach(btn=>{
    btn.onclick = async ()=>{
      if (!confirm('Delete this order? This cannot be undone.')) return;
      const tr = btn.closest('tr'); const id = tr.getAttribute('data-id');
      // Optional: delete child items first if you have FK constraints
      await supa.from('order_items').delete().eq('order_id', id);
      const { error } = await supa.from('orders').delete().eq('id', id);
      if (error){ alert(error.message); return; }
      await load();
    };
  });
}

/* ---------- Boot ---------- */
document.addEventListener('DOMContentLoaded', async ()=>{
  const ok = await checkAdmin();
  if (!ok) return;
  document.getElementById('listWrap').classList.remove('hidden');

  // live search
  qEl.addEventListener('input', render);
  statusEl.addEventListener('change', render);
  fromEl.addEventListener('change', render);
  toEl.addEventListener('change', render);

  await load();

  // realtime updates
  try{
    supa.channel('rt_admin_orders')
      .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, async ()=>{ await load(); })
      .on('postgres_changes', { event:'*', schema:'public', table:'order_items' }, async ()=>{ await load(); })
      .subscribe();
  }catch{}
});
</script>
</body>
</html>
