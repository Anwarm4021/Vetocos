<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>VetoCos | Actualités</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Actualités VetoCos par région" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#0f162f;--muted:#8ea0c8;--text:#f6f7fb;--br:14px}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,var(--bg),#101835);color:var(--text);font-family:Inter,sans-serif}
    main{max-width:960px;margin:40px auto;padding:0 18px}
    h1{margin:0 0 12px}
    .card{background:var(--card);border:1px solid rgba(141,158,199,.18);border-radius:var(--br);padding:16px;margin-bottom:12px}
    .muted{color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    select{padding:10px 12px;border-radius:12px;border:1px solid rgba(141,158,199,.25);background:rgba(255,255,255,.05);color:var(--text)}
    a{color:#6dd5ff;text-decoration:none}
    img{max-width:100%;border-radius:10px;border:1px solid rgba(141,158,199,.18)}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="row">
    <h1>Actualités</h1>
    <div>
      <label class="muted" for="regions">Région</label>
      <select id="regions"></select>
    </div>
  </div>
  <div id="msg" class="muted">Chargement…</div>
  <div id="list"></div>
</main>

<script>
  const supa = supabase.createClient(
    "https://qdepgviimbcdlozjpbhm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZXBndmlpbWJjZGxvempwYmhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0OTgwOTAsImV4cCI6MjA3NTA3NDA5MH0.-F95mmQw-pnsD-K8FIUtbj3oWeiPCSE0Pmuco9lYo_0",
    { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }
  );
  const regionsSel = document.getElementById('regions');
  const list = document.getElementById('list');
  const msg  = document.getElementById('msg');

  function filePublicUrl(bucket, path){
    return `https://qdepgviimbcdlozjpbhm.supabase.co/storage/v1/object/public/${bucket}/${encodeURI(path.replace(new RegExp('^'+bucket+'/'),''))}`;
  }

  async function loadRegions(){
    const { data } = await supa.from('site_settings').select('value').eq('key','active_regions').maybeSingle();
    const active = Array.isArray(data?.value) ? data.value : ["Africa","Global"];
    regionsSel.innerHTML = active.map(r=>`<option value="${r}">${r}</option>`).join('');
  }

  async function loadNews(){
    msg.textContent='Chargement…';
    const region = regionsSel.value || 'Africa';
    // Only published items in enabled region
    const { data, error } = await supa.from('news')
      .select('id,title,body,region,image_path,file_path,created_at,published')
      .eq('published', true)
      .eq('region', region)
      .order('created_at',{ ascending:false });
    if (error){ msg.textContent = error.message; return; }
    const rows = data || [];
    list.innerHTML = rows.map(n=>{
      const img = n.image_path ? `<img src="${filePublicUrl('NewsFiles', n.image_path)}" alt="">` : '';
      const att = n.file_path ? `<a href="${filePublicUrl('NewsFiles', n.file_path)}" target="_blank" rel="noopener">Pièce jointe</a>` : '';
      return `<article class="card">
        <h2 style="margin:.2rem 0">${n.title}</h2>
        <div class="muted" style="font-size:.9rem">${new Date(n.created_at).toLocaleString()} · ${n.region}</div>
        <div style="margin:10px 0">${img}</div>
        <p>${(n.body||'').replace(/</g,'&lt;')}</p>
        <div style="margin-top:8px">${att}</div>
      </article>`;
    }).join('');
    msg.textContent = rows.length ? '' : 'Aucune actualité.';
  }

  regionsSel.addEventListener('change', loadNews);
  document.addEventListener('DOMContentLoaded', async ()=>{
    await loadRegions();
    await loadNews();
  });
</script>
</body>
</html>
